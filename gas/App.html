<script>
(function () {
  'use strict';

  // ================= ตัวช่วย =================
  const $ = (s, el) => (el || document).querySelector(s);
  const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g,
    (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = (n) => Number(n || 0).toLocaleString('th-TH', { maximumFractionDigits: 2 });
  const TH_M = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
  const thDate = (iso) => {
    if (!iso) return '-';
    const p = String(iso).slice(0, 10).split('-').map(Number);
    return p[2] + ' ' + TH_M[p[1] - 1] + ' ' + String(p[0] + 543).slice(-2);
  };
  const thMonth = (ym) => { const p = ym.split('-').map(Number); return TH_M[p[1] - 1] + ' ' + (p[0] + 543); };
  const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
  const thisMonth = () => today().slice(0, 7);

  const STATUS = {
    paid: 'ชำระแล้ว', pending: 'รอตรวจสลิป', unpaid: 'ค้างชำระ', approved: 'อนุมัติ', rejected: 'ไม่ผ่าน',
    reported: 'แจ้งแล้ว', in_progress: 'กำลังซ่อม', done: 'เสร็จแล้ว',
    occupied: 'มีผู้เช่า', vacant: 'ว่าง', maintenance: 'ปิดปรับปรุง', active: 'พักอยู่', ended: 'ย้ายออกแล้ว',
  };
  const pill = (s) => `<span class="pill s-${esc(s)}">${esc(STATUS[s] || s || '-')}</span>`;

  // ไอคอนเส้น (24x24)
  const ICONS = {
    home: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/>',
    door: '<path d="M6 21V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v17"/><path d="M3 21h18"/><circle cx="14.5" cy="12" r=".8" fill="currentColor"/>',
    bill: '<path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 7h6M9 11h6M9 15h4"/>',
    card: '<rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19M6 15h4"/>',
    wrench: '<path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L3.5 17.3a1.8 1.8 0 0 0 2.5 2.5l5.8-5.8a4 4 0 0 0 5.2-5.4l-2.6 2.6-2.4-.3-.3-2.4z"/>',
    gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3h0a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8v0a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>',
    user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
    users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6.5 6.5 0 0 1 3.5 6"/>',
    drop: '<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
    bolt: '<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
    check: '<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',
    shield: '<path d="M12 3 4 6v6c0 4.5 3.4 8.3 8 9 4.6-.7 8-4.5 8-9V6z"/><path d="m9 12 2 2 4-4"/>',
    phone: '<path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/>',
    file: '<path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4M9 13h6M9 17h6"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
    upload: '<path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v4h16v-4"/>',
  };
  const ic = (name) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ''}</svg>`;
  const sec = (title, right) => `<div class="sec"><h2>${title}</h2>${right ? `<div class="row">${right}</div>` : ''}</div>`;
  const initial = (name) => esc(String(name || '?').replace(/^(นาย|นางสาว|นาง|น\.ส\.)\s*/, '').trim().charAt(0) || '?');

  const PUB = window.PUB || {};
  const SHELL = PUB.shellOrigin || ''; // origin ของหน้า GitHub Pages
  if (PUB.primaryColor) document.documentElement.style.setProperty('--accent', PUB.primaryColor);
  $('#title').textContent = PUB.dormName || 'หอพัก';

  const state = { token: null, role: null, tab: null, admin: null, cache: {}, dirty: false };
  // จำว่าผู้ใช้เริ่มพิมพ์ในฟอร์มแล้ว จะได้ไม่วาดหน้าทับตอนข้อมูลใหม่มาถึง
  document.getElementById('view').addEventListener('input', () => { state.dirty = true; });

  // ================= เก็บ token =================
  // เก็บใน localStorage ของ iframe และส่งให้หน้า PWA shell เก็บสำรองด้วย
  // (Safari อาจล้าง storage ของ iframe ข้ามโดเมน)
  const Store = {
    get() { try { return localStorage.getItem('dormToken'); } catch (e) { return null; } },
    set(t) {
      try { t ? localStorage.setItem('dormToken', t) : localStorage.removeItem('dormToken'); } catch (e) { /* ignore */ }
      if (SHELL) try { window.top.postMessage({ type: 'dorm-token', token: t || '' }, SHELL); } catch (e) { /* ignore */ }
    },
    getMe() {
      try { return JSON.parse(localStorage.getItem('dormMe') || 'null'); } catch (e) { return null; }
    },
    setMe(me) {
      try { me ? localStorage.setItem('dormMe', JSON.stringify(me)) : localStorage.removeItem('dormMe'); } catch (e) { /* ignore */ }
    },
    fromShell() {
      if (!SHELL) return Promise.resolve(null);
      // ไม่ได้เปิดผ่านหน้า PWA (เช่น เปิดลิงก์ Apps Script ตรง ๆ) ก็ไม่ต้องรอ
      const anc = location.ancestorOrigins;
      if (anc && anc.length && anc[anc.length - 1] !== SHELL) return Promise.resolve(null);
      return new Promise((resolve) => {
        const h = (e) => {
          if (e.origin !== SHELL || !e.data || e.data.type !== 'dorm-token-reply') return;
          window.removeEventListener('message', h);
          resolve(e.data.token || null);
        };
        window.addEventListener('message', h);
        try { window.top.postMessage({ type: 'dorm-ready' }, SHELL); } catch (e) { /* ignore */ }
        setTimeout(() => { window.removeEventListener('message', h); resolve(null); }, 500);
      });
    },
  };

  // ================= เรียก Apps Script =================
  function run(fn, ...args) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler((err) => {
          const msg = (err && err.message) || String(err);
          if (msg.indexOf('AUTH:') >= 0) {
            Store.set(null);
            Store.setMe(null);
            state.token = null;
            setTimeout(showLogin, 0);
          }
          reject(new Error(msg.replace(/^.*AUTH:\s*/, '')));
        })[fn](...args);
    });
  }
  // คำสั่งที่แก้ข้อมูล ให้ล้างข้อมูลที่จำไว้ทั้งหมด หน้าถัดไปจะได้ไม่โชว์ของเก่า
  const READ_ONLY = /^api(Get|List|AdminBootstrap|RoomDetail|TenantHome|WhoAmI)/;
  async function api(fn, ...args) {
    const res = await run(fn, state.token, ...args);
    if (!READ_ONLY.test(fn)) state.cache = {};
    return res;
  }

  /**
   * แสดงข้อมูลที่จำไว้ทันที แล้วโหลดของใหม่มาแทนเบื้องหลัง
   * ถ้าข้อมูลไม่เปลี่ยน หรือผู้ใช้กำลังกรอกฟอร์มอยู่ จะไม่วาดทับ
   */
  async function swr(key, fetcher, draw) {
    const tab = state.tab;
    const old = state.cache[key];
    if (old) { state.dirty = false; draw(old.data); }
    const data = await fetcher();
    const json = JSON.stringify(data);
    state.cache[key] = { data, json };
    if (state.tab !== tab) return;
    if (old && (old.json === json || state.dirty)) return;
    state.dirty = false;
    draw(data);
  }

  function toast(msg, isErr) {
    const t = $('#toast');
    t.textContent = msg;
    t.className = isErr ? 'err' : '';
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.add('hidden'), isErr ? 5000 : 2500);
  }
  const fail = (e) => toast(e.message || String(e), true);

  /** ปิดปุ่มระหว่างรอ */
  async function busy(btn, fn) {
    const old = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'กำลังทำงาน…';
    try { return await fn(); } catch (e) { fail(e); } finally { btn.disabled = false; btn.textContent = old; }
  }

  // ================= modal =================
  function openModal(title, html) {
    $('#modalTitle').textContent = title;
    $('#modalBody').innerHTML = html;
    $('#modal').classList.remove('hidden');
    return $('#modalBody');
  }
  function closeModal() {
    $('#modal').classList.add('hidden');
    $('#modalBody').innerHTML = '';
  }
  $('#modal').addEventListener('click', (e) => {
    if (e.target.id === 'modal' || e.target.hasAttribute('data-close')) closeModal();
  });

  const formData = (form) => Object.fromEntries(new FormData(form).entries());

  // ================= ไฟล์ =================
  function loadImg(file) {
    return new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => { URL.revokeObjectURL(img.src); res(img); };
      img.onerror = rej;
      img.src = URL.createObjectURL(file);
    });
  }
  /** อ่านไฟล์เป็น base64 ย่อรูปให้ด้านยาวไม่เกิน 1600px */
  async function readFile(file) {
    if (/^image\/(jpeg|png|webp|heic|heif)/.test(file.type)) {
      try {
        const img = await loadImg(file);
        const s = Math.min(1, 1600 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s);
        c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        return { name: file.name.replace(/\.\w+$/, '') + '.jpg', mimeType: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.85).split(',')[1] };
      } catch (e) { /* ใช้ไฟล์เดิม */ }
    }
    const data = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(String(r.result).split(',')[1]);
      r.onerror = rej;
      r.readAsDataURL(file);
    });
    return { name: file.name, mimeType: file.type, data };
  }
  const readFiles = (input) => Promise.all(Array.from(input.files || []).map(readFile));

  // PDF แสดงใน iframe ไม่ได้ (Chrome/มือถือบล็อกใน sandbox ของ Apps Script) จึงวาดเองด้วย PDF.js
  const PDFJS = 'https:\/\/cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  let pdfjsReady = null;
  function loadPdfJs() {
    if (!pdfjsReady) {
      pdfjsReady = new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = PDFJS + 'pdf.min.js';
        s.onload = () => {
          window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js';
          resolve(window.pdfjsLib);
        };
        s.onerror = () => { pdfjsReady = null; reject(new Error('โหลดตัวแสดง PDF ไม่ได้ ลองใหม่อีกครั้ง')); };
        document.head.appendChild(s);
      });
    }
    return pdfjsReady;
  }

  async function renderPdf(bytes, box) {
    const lib = await loadPdfJs();
    const pdf = await lib.getDocument({ data: bytes, cMapUrl: PDFJS + 'cmaps/', cMapPacked: true }).promise;
    box.innerHTML = '';
    const width = box.clientWidth || 600;
    const ratio = Math.min(window.devicePixelRatio || 1, 2);
    for (let n = 1; n <= pdf.numPages; n++) {
      const page = await pdf.getPage(n);
      const base = page.getViewport({ scale: 1 });
      const vp = page.getViewport({ scale: (width / base.width) * ratio });
      const c = document.createElement('canvas');
      c.width = Math.floor(vp.width);
      c.height = Math.floor(vp.height);
      c.style.width = '100%';
      box.appendChild(c);
      await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    }
  }

  async function viewFile(fileId, title) {
    const body = openModal(title || 'ไฟล์', '<div class="center muted">กำลังโหลดไฟล์…</div>');
    try {
      const f = await api('apiGetFile', fileId);
      const bin = atob(f.data);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const url = URL.createObjectURL(new Blob([bytes], { type: f.mimeType }));
      const isImg = f.mimeType.indexOf('image/') === 0;
      const isPdf = f.mimeType === 'application/pdf';
      body.innerHTML = `<div class="viewer">${isImg ? `<img src="${url}" alt="">` : isPdf ? '<div class="pdf-pages"><div class="center muted">กำลังแสดง PDF…</div></div>' : ''}</div>
        <p><a class="btn ghost" href="${url}" download="${esc(f.name)}">ดาวน์โหลด ${esc(f.name)}</a></p>`;
      if (isPdf) {
        const box = $('.pdf-pages', body);
        try { await renderPdf(bytes.slice(), box); } catch (err) { box.innerHTML = `<p class="muted">แสดง PDF ไม่ได้ (${esc(err.message)}) กดดาวน์โหลดเพื่อเปิดดูแทน</p>`; }
      }
    } catch (e) { body.innerHTML = `<p class="muted">${esc(e.message)}</p>`; }
  }
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-file]');
    if (b) viewFile(b.dataset.file, b.dataset.title);
  });

  // ================= แท็บ =================
  // เมนูเดียวกันแสดง 2 แบบ: แถบบน (คอม) และแท็บล่าง (มือถือ)
  function setTabs(tabs) {
    const badge = (t) => `<span class="badge hidden" data-badge="${t.id}"></span>`;
    $('#tabs').innerHTML = tabs.map((t) => `<button type="button" data-tab="${t.id}"><span class="ico">${ic(t.ico)}</span><span>${t.label}</span>${badge(t)}</button>`).join('');
    $('#topnav').innerHTML = tabs.map((t) => `<button type="button" data-tab="${t.id}">${ic(t.ico)}<span>${t.label}</span>${badge(t)}</button>`).join('');
    ['#tabs', '#topnav'].forEach((sel) => {
      const nav = $(sel);
      nav.classList.remove('hidden');
      nav.onclick = (e) => { const b = e.target.closest('[data-tab]'); if (b) go(b.dataset.tab); };
    });
    state.tabs = tabs;
  }
  function setBadge(id, n) {
    $$(`[data-badge="${id}"]`).forEach((el) => {
      el.textContent = n;
      el.classList.toggle('hidden', !n);
    });
  }
  function go(id) {
    state.tab = id;
    $$('[data-tab]').forEach((b) => b.classList.toggle('active', b.dataset.tab === id));
    const t = state.tabs.find((x) => x.id === id);
    $('#view').innerHTML = '<div class="center muted">กำลังโหลด…</div>';
    window.scrollTo(0, 0);
    Promise.resolve(t.render()).catch((e) => { $('#view').innerHTML = `<div class="center muted">${esc(e.message)}</div>`; });
  }

  // ================= เข้าสู่ระบบ =================
  function showLogin() {
    state.role = null;
    state.cache = {};
    state.admin = null;
    state.tenant = null;
    ['#tabs', '#topnav', '#logoutBtn', '#who'].forEach((s) => $(s).classList.add('hidden'));
    closeModal();
    $('#view').innerHTML = `
      <div class="auth">
        <section class="hero">
          <h1>${esc(PUB.dormName || 'หอพัก')}</h1>
          <p>ผู้เช่าใช้ดูบิล ส่งสลิป และแจ้งซ่อม</p>
          <div class="feat">
            <div><span class="ic">${ic('bill')}</span>ใบแจ้งค่าเช่า ค่าน้ำ ค่าไฟ รายเดือน</div>
            <div><span class="ic">${ic('upload')}</span>ส่งสลิปโอนเงิน</div>
            <div><span class="ic">${ic('wrench')}</span>แจ้งซ่อม</div>
          </div>
        </section>
        <section class="card auth-form">
          <h2>เข้าสู่ระบบ</h2>
          <div class="seg"><button type="button" class="on" data-mode="tenant">ผู้เช่า</button><button type="button" data-mode="admin">ผู้ดูแลหอ</button></div>
          <form id="loginForm" autocomplete="on">
            <div data-for="tenant">
              <label>เลขห้อง</label><input name="roomId" inputmode="numeric" autocomplete="username" placeholder="เช่น 101">
              <label>PIN 6 หลัก</label><input name="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password" placeholder="••••••">
              <div class="muted" style="font-size:13px;margin-top:6px">ขอ PIN ได้ที่ผู้ดูแลหอ ${PUB.phone && PUB.phone !== '-' ? '· โทร ' + esc(PUB.phone) : ''}</div>
            </div>
            <div data-for="admin" class="hidden">
              <label>รหัสผ่านผู้ดูแล</label><input name="password" type="password" autocomplete="current-password">
            </div>
            <p style="margin-top:20px"><button type="submit" style="width:100%">เข้าสู่ระบบ ${ic('arrow')}</button></p>
          </form>
        </section>
      </div>`;
    let mode = 'tenant';
    $('.seg').onclick = (e) => {
      const b = e.target.closest('[data-mode]');
      if (!b) return;
      mode = b.dataset.mode;
      $$('.seg button').forEach((x) => x.classList.toggle('on', x === b));
      $$('[data-for]').forEach((x) => x.classList.toggle('hidden', x.dataset.for !== mode));
    };
    $('#loginForm').onsubmit = (e) => {
      e.preventDefault();
      const d = formData(e.target);
      d.mode = mode;
      busy($('#loginForm button[type=submit]'), async () => {
        const r = await run('apiLogin', d);
        state.token = r.token;
        state.roomId = r.roomId || '';
        Store.set(r.token);
        Store.setMe({ role: r.role, roomId: state.roomId });
        start(r.role);
      });
    };
  }

  $('#logoutBtn').onclick = async () => {
    try { await run('apiLogout', state.token); } catch (e) { /* ignore */ }
    Store.set(null);
    Store.setMe(null);
    state.token = null;
    showLogin();
  };

  function start(role) {
    state.role = role;
    $('#logoutBtn').classList.remove('hidden');
    $('#who').classList.remove('hidden');
    $('#who').textContent = role === 'admin' ? 'ผู้ดูแล' : 'ห้อง ' + (state.roomId || '');
    if (role === 'admin') {
      setTabs([
        { id: 'rooms', ico: 'home', label: 'ภาพรวม', render: adminRooms },
        { id: 'billing', ico: 'bill', label: 'มิเตอร์ & บิล', render: adminBilling },
        { id: 'payments', ico: 'card', label: 'สลิป', render: adminPayments },
        { id: 'repairs', ico: 'wrench', label: 'งานซ่อม', render: adminRepairs },
        { id: 'settings', ico: 'gear', label: 'ตั้งค่า', render: adminSettings },
      ]);
      go('rooms');
    } else {
      setTabs([
        { id: 'bills', ico: 'bill', label: 'บิลของฉัน', render: tenantBills },
        { id: 'repair', ico: 'wrench', label: 'แจ้งซ่อม', render: tenantRepair },
        { id: 'me', ico: 'user', label: 'ห้องของฉัน', render: tenantMe },
      ]);
      go('bills');
    }
  }

  // =====================================================
  // ผู้ดูแล
  // =====================================================

  async function loadAdmin() {
    state.admin = await api('apiAdminBootstrap');
    setBadge('payments', state.admin.pendingPayments);
    setBadge('repairs', state.admin.openRepairs);
    return state.admin;
  }

  function adminRooms(cached) {
    if (cached === true && state.admin) return drawRooms(state.admin);
    return swr('admin', loadAdmin, drawRooms);
  }
  function drawRooms(d) {
    state.admin = d;
    setBadge('payments', d.pendingPayments);
    setBadge('repairs', d.openRepairs);
    const occ = d.rooms.filter((r) => r.status === 'occupied').length;
    const vacant = d.rooms.filter((r) => r.status === 'vacant').length;
    const pct = d.rooms.length ? Math.round((occ / d.rooms.length) * 100) : 0;
    const filter = state.roomFilter || 'all';
    $('#view').innerHTML = `
      <section class="hero">
        <span class="eyebrow">${thMonth(thisMonth())}</span>
        <h1>ภาพรวม</h1>
        <div class="hero-actions">
          <button type="button" id="hGoBill">${ic('bill')} จดมิเตอร์ & ออกบิล</button>
          <button type="button" class="light" id="hGoPay">${ic('card')} ตรวจสลิป${d.pendingPayments ? ' (' + d.pendingPayments + ')' : ''}</button>
        </div>
        <div class="stats">
          <div class="stat"><span class="ic">${ic('users')}</span><div><b>${occ}/${d.rooms.length}</b><span>ห้องมีผู้เช่า</span></div></div>
          <div class="stat"><span class="ic">${ic('door')}</span><div><b>${vacant}</b><span>ห้องว่าง</span></div></div>
          <div class="stat"><span class="ic">${ic('card')}</span><div><b>${d.pendingPayments}</b><span>สลิปรอตรวจ</span></div></div>
          <div class="stat"><span class="ic">${ic('check')}</span><div><b>${pct}%</b><span>อัตราการเข้าพัก</span></div></div>
        </div>
      </section>
      ${sec('ห้องทั้งหมด', `
        <div class="filters">
          ${[['all', 'ทั้งหมด'], ['occupied', 'มีผู้เช่า'], ['vacant', 'ว่าง'], ['maintenance', 'ปิดปรับปรุง']].map(([k, l]) => `<button type="button" class="small ${filter === k ? 'on' : ''}" data-f="${k}">${l}</button>`).join('')}
        </div>`)}
      <div class="rooms">
        ${d.rooms.filter((r) => filter === 'all' || r.status === filter).map((r) => `
          <button type="button" class="room ${esc(r.status)}" data-room="${esc(r.id)}">
            <div class="room-top"><span class="no">${esc(r.number)}</span><span class="ic">${ic(r.status === 'occupied' ? 'user' : r.status === 'maintenance' ? 'wrench' : 'door')}</span></div>
            <div class="who">${r.tenantName ? esc(r.tenantName) : '<span class="muted">—</span>'}</div>
            <div class="row spread"><span class="meta">${fmt(r.rent)} ฿/เดือน</span>${pill(r.status)}</div>
          </button>`).join('') || '<div class="muted">ไม่มีห้องในกลุ่มนี้</div>'}
      </div>
      ${d.openRepairs ? `<div class="card li" style="margin-top:16px"><span class="ic">${ic('wrench')}</span><div class="grow"><strong>งานซ่อมค้าง ${d.openRepairs} รายการ</strong></div><button type="button" class="small ghost" id="hGoRep">ดู</button></div>` : ''}`;
    $('.rooms').onclick = (e) => { const b = e.target.closest('[data-room]'); if (b) openRoom(b.dataset.room); };
    $('.filters').onclick = (e) => { const b = e.target.closest('[data-f]'); if (b) { state.roomFilter = b.dataset.f; adminRooms(true); } };
    $('#hGoBill').onclick = () => go('billing');
    $('#hGoPay').onclick = () => go('payments');
    if ($('#hGoRep')) $('#hGoRep').onclick = () => go('repairs');
  }

  async function openRoom(roomId) {
    const body = openModal('ห้อง ' + roomId, '<div class="center muted">กำลังโหลด…</div>');
    let d;
    try { d = await api('apiRoomDetail', roomId); } catch (e) { body.innerHTML = esc(e.message); return; }
    const r = d.room;
    const cur = d.tenancies.find((t) => t.status === 'active');
    body.innerHTML = `
      ${cur ? `
        <div class="card">
          <div class="tenant-head">
            <span class="avatar">${initial(cur.tenantName)}</span>
            <div class="grow"><div class="row spread"><strong style="font-size:18px">${esc(cur.tenantName)}</strong>${pill('active')}</div>
            <div class="muted">ย้ายเข้า ${thDate(cur.moveIn)} · ค่าเช่า ${fmt(cur.rent)} ฿ · ประกัน ${fmt(cur.deposit)} ฿</div></div>
          </div>
          <div class="row" style="margin-top:14px">
            <button type="button" class="small" id="btnContract">${cur.contractFileId ? 'สร้างสัญญาใหม่' : 'สร้างสัญญาเช่า'}</button>
            ${cur.contractFileId ? `<button type="button" class="small ghost" data-file="${esc(cur.contractFileId)}" data-title="สัญญาเช่า">ดูสัญญา</button>` : ''}
            <button type="button" class="small ghost" id="btnPin">ออก PIN ใหม่</button>
            <button type="button" class="small danger" id="btnOut">ย้ายออก</button>
          </div>
        </div>` : `
        <div class="card">
          <div class="li"><span class="ic">${ic('door')}</span><div><div class="muted" style="font-size:13px">ห้องว่าง</div><strong style="font-size:18px">บันทึกย้ายเข้า</strong></div></div>
          <form id="inForm">
            <label>ชื่อ-นามสกุลผู้เช่า *</label><input name="name" required>
            <div class="grid2">
              <div><label>เบอร์โทร</label><input name="phone" inputmode="tel"></div>
              <div><label>เลขบัตรประชาชน</label><input name="idCard" inputmode="numeric"></div>
            </div>
            <label>ที่อยู่ตามบัตร</label><textarea name="address"></textarea>
            <div class="grid2">
              <div><label>วันย้ายเข้า</label><input name="moveIn" type="date" value="${today()}"></div>
              <div><label>ค่าเช่า/เดือน</label><input name="rent" type="number" value="${esc(r.rent)}"></div>
              <div><label>เงินประกัน</label><input name="deposit" type="number" value="${esc(r.deposit)}"></div>
              <div></div>
              <div><label>มิเตอร์น้ำตอนเข้า</label><input name="water" type="number" step="any" required></div>
              <div><label>มิเตอร์ไฟตอนเข้า</label><input name="electric" type="number" step="any" required></div>
            </div>
            <p><button type="submit">บันทึกย้ายเข้า</button></p>
          </form>
        </div>`}

      <h3>ข้อมูลห้อง</h3>
      <form id="roomForm" class="card">
        <div class="grid2">
          <div><label>ค่าเช่ามาตรฐาน</label><input name="rent" type="number" value="${esc(r.rent)}"></div>
          <div><label>เงินประกันมาตรฐาน</label><input name="deposit" type="number" value="${esc(r.deposit)}"></div>
        </div>
        <label>สถานะ</label>
        <select name="status" ${cur ? 'disabled' : ''}>
          ${['vacant', 'occupied', 'maintenance'].map((s) => `<option value="${s}" ${r.status === s ? 'selected' : ''}>${STATUS[s]}</option>`).join('')}
        </select>
        <label>หมายเหตุ</label><textarea name="note">${esc(r.note)}</textarea>
        <p><button type="submit" class="ghost">บันทึกข้อมูลห้อง</button></p>
      </form>

      <h3>ประวัติการเข้าพัก</h3>
      <div class="card">${d.tenancies.length ? d.tenancies.map((t) => `
        <div class="list-item row spread">
          <div class="grow"><strong>${esc(t.tenantName)}</strong>
            <div class="muted">${thDate(t.moveIn)} – ${t.moveOut ? thDate(t.moveOut) : 'ปัจจุบัน'}${t.note ? ' · ' + esc(t.note) : ''}</div></div>
          <div>${pill(t.status)} ${t.contractFileId ? `<button type="button" class="small ghost" data-file="${esc(t.contractFileId)}" data-title="สัญญาเช่า">สัญญา</button>` : ''}</div>
        </div>`).join('') : '<span class="muted">ยังไม่มีประวัติ</span>'}</div>

      <h3 class="row spread">ประวัติซ่อม/เปลี่ยนอะไหล่ <button type="button" class="small" id="btnAddRepair">+ เพิ่ม</button></h3>
      <div class="card">${d.repairs.length ? d.repairs.map(repairRow).join('') : '<span class="muted">ยังไม่มีประวัติ</span>'}</div>

      <h3>ใบแจ้งหนี้</h3>
      <div class="card">${d.invoices.length ? d.invoices.map((i) => `
        <div class="list-item row spread">
          <div class="grow">${thMonth(i.month)} · <strong>${fmt(i.total)} ฿</strong> <span class="muted">${esc(i.tenantName)}</span></div>
          <div>${pill(i.status)} ${i.pdfFileId ? `<button type="button" class="small ghost" data-file="${esc(i.pdfFileId)}" data-title="ใบแจ้งหนี้ ${esc(i.month)}">PDF</button>` : ''}</div>
        </div>`).join('') : '<span class="muted">ยังไม่มี</span>'}</div>`;

    const refresh = () => { openRoom(roomId); if (state.tab === 'rooms') adminRooms(); };

    $('#roomForm', body).onsubmit = (e) => {
      e.preventDefault();
      const f = formData(e.target);
      f.id = roomId;
      if (cur) f.status = 'occupied';
      busy($('button[type=submit]', e.target), async () => { await api('apiSaveRoom', f); toast('บันทึกแล้ว'); refresh(); });
    };
    $('#btnAddRepair', body).onclick = () => repairForm({ roomId });
    $$('[data-repair]', body).forEach((el) => {
      el.onclick = () => repairForm(d.repairs.find((x) => x.id === el.dataset.repair));
    });

    if (cur) {
      $('#btnContract', body).onclick = (e) => busy(e.target, async () => {
        const res = await api('apiGenerateContract', cur.id);
        toast('สร้างสัญญาแล้ว');
        openModal('สัญญาเช่า', `<p>สร้างสัญญาเรียบร้อย</p>
          <p class="row"><button type="button" data-file="${esc(res.pdfId)}" data-title="สัญญาเช่า">ดู PDF</button>
          <a class="btn ghost" href="${esc(res.docUrl)}" target="_blank" rel="noopener">แก้ไขใน Google Docs</a></p>`);
      });
      $('#btnPin', body).onclick = (e) => {
        if (!confirm('ออก PIN ใหม่? PIN เดิมจะใช้ไม่ได้ทันที')) return;
        busy(e.target, async () => showPin(roomId, (await api('apiResetPin', roomId)).pin));
      };
      $('#btnOut', body).onclick = () => {
        const b = openModal('ย้ายออก ห้อง ' + roomId, `
          <form id="outForm">
            <p>ผู้เช่า: <strong>${esc(cur.tenantName)}</strong></p>
            <label>วันย้ายออก</label><input name="moveOut" type="date" value="${today()}">
            <label>หมายเหตุ (เช่น คืนเงินประกัน/หักค่าเสียหาย)</label><textarea name="note"></textarea>
            <p><button type="submit" class="danger">ยืนยันย้ายออก</button></p>
          </form>`);
        $('#outForm', b).onsubmit = (e) => {
          e.preventDefault();
          const f = formData(e.target);
          f.roomId = roomId;
          busy($('button[type=submit]', e.target), async () => { await api('apiMoveOut', f); toast('บันทึกย้ายออกแล้ว'); refresh(); });
        };
      };
    } else {
      $('#inForm', body).onsubmit = (e) => {
        e.preventDefault();
        const f = formData(e.target);
        const data = {
          roomId, moveIn: f.moveIn, rent: f.rent, deposit: f.deposit, water: f.water, electric: f.electric,
          tenant: { name: f.name, phone: f.phone, idCard: f.idCard, address: f.address },
        };
        busy($('button[type=submit]', e.target), async () => {
          const res = await api('apiMoveIn', data);
          if (state.tab === 'rooms') adminRooms();
          showPin(roomId, res.pin);
        });
      };
    }
  }

  function showPin(roomId, pin) {
    const b = openModal('PIN สำหรับผู้เช่า', `
      <p>ให้ผู้เช่าเข้าระบบด้วย <strong>เลขห้อง ${esc(roomId)}</strong> และ PIN นี้</p>
      <div class="pin">${esc(pin)}</div>
      <p class="muted">PIN จะแสดงครั้งเดียว ถ้าลืมให้กด "ออก PIN ใหม่"</p>
      <p><button type="button" id="pinOk">เสร็จ</button></p>`);
    $('#pinOk', b).onclick = () => openRoom(roomId);
  }

  // ---------- บิล / มิเตอร์ ----------
  function adminBilling(month) {
    month = month || state.billMonth || thisMonth();
    state.billMonth = month;
    return swr('bill_' + month,
      () => Promise.all([api('apiGetMonthSheet', month), api('apiListInvoices', month)]),
      (r) => drawBilling(month, r[0], r[1]));
  }
  function drawBilling(month, rows, invoices) {
    $('#view').innerHTML = `
      ${sec(`จดมิเตอร์ ${thMonth(month)}`, `<input type="month" id="mon" value="${month}" style="width:auto">`)}
      <p class="muted" style="font-size:14px;margin-top:-6px">กรอกเลขมิเตอร์สิ้นเดือน หน่วยที่ใช้คิดจากเลขเดือนก่อน</p>
      <div class="card scroll-x">
        ${rows.length ? `<table id="meter">
          <thead><tr><th>ห้อง</th><th class="num">${ic('drop')} น้ำ (ก่อน)</th><th>น้ำ (ล่าสุด)</th><th class="num">${ic('bolt')} ไฟ (ก่อน)</th><th>ไฟ (ล่าสุด)</th><th>บิล</th></tr></thead>
          <tbody>${rows.map((r) => `
            <tr data-room="${esc(r.roomId)}">
              <td><strong>${esc(r.roomId)}</strong><div class="muted" style="font-size:13px">${esc(r.tenantName)}</div></td>
              <td class="num">${fmt(r.prevWater)}</td>
              <td><input name="water" type="number" step="any" inputmode="decimal" value="${esc(r.water)}"></td>
              <td class="num">${fmt(r.prevElectric)}</td>
              <td><input name="electric" type="number" step="any" inputmode="decimal" value="${esc(r.electric)}"></td>
              <td>${r.invoiceStatus ? pill(r.invoiceStatus) : '<span class="muted">-</span>'}</td>
            </tr>`).join('')}</tbody></table>` : '<p class="muted">ยังไม่มีห้องที่มีผู้เช่า</p>'}
      </div>
      <div class="row">
        <button type="button" class="ghost" id="saveMeter">บันทึกเลขมิเตอร์</button>
        <button type="button" id="genInv">${ic('bill')} บันทึก + ออกใบแจ้งหนี้</button>
      </div>
      <div id="genResult" style="margin-top:12px"></div>
      ${sec(`ใบแจ้งหนี้ ${thMonth(month)}`)}
      <div class="card">${invoices.length ? invoices.map((i) => `
        <div class="list-item row spread">
          <div class="grow"><strong>ห้อง ${esc(i.roomId)}</strong> ${esc(i.tenantName)}<div class="muted">${fmt(i.total)} ฿ · ครบกำหนด ${thDate(i.dueDate)}</div></div>
          <div class="row">
            ${i.pdfFileId ? `<button type="button" class="small ghost" data-file="${esc(i.pdfFileId)}" data-title="ใบแจ้งหนี้ ${esc(i.roomId)}">PDF</button>` : ''}
            <select data-inv="${esc(i.id)}" style="width:auto">
              ${['unpaid', 'pending', 'paid'].map((s) => `<option value="${s}" ${i.status === s ? 'selected' : ''}>${STATUS[s]}</option>`).join('')}
            </select>
          </div>
        </div>`).join('') : '<span class="muted">ยังไม่ได้ออกใบแจ้งหนี้</span>'}</div>`;

    $('#mon').onchange = (e) => e.target.value && go_billing(e.target.value);
    const collect = () => $$('#meter tbody tr').map((tr) => ({
      roomId: tr.dataset.room, water: $('[name=water]', tr).value, electric: $('[name=electric]', tr).value,
    }));
    $('#saveMeter').onclick = (e) => busy(e.target, async () => { await api('apiSaveReadings', month, collect()); toast('บันทึกเลขมิเตอร์แล้ว'); });
    $('#genInv').onclick = (e) => {
      if (!confirm('ออกใบแจ้งหนี้ทุกห้องที่จดมิเตอร์แล้ว?')) return;
      busy(e.target, async () => {
        await api('apiSaveReadings', month, collect());
        const res = await api('apiGenerateInvoices', month);
        await adminBilling(month);
        $('#genResult').innerHTML = `<div class="card">${res.map((r) => `<div>ห้อง ${esc(r.roomId)}: ${r.ok ? fmt(r.total) + ' บาท' : '<span style="color:var(--bad)">' + esc(r.error) + '</span>'}</div>`).join('')}</div>`;
      });
    };
    $$('[data-inv]').forEach((sel) => {
      sel.onchange = async () => {
        try { await api('apiSetInvoiceStatus', sel.dataset.inv, sel.value); toast('อัปเดตสถานะแล้ว'); } catch (e) { fail(e); }
      };
    });
  }
  function go_billing(m) { $('#view').innerHTML = '<div class="center muted">กำลังโหลด…</div>'; adminBilling(m).catch(fail); }

  // ---------- สลิป ----------
  function adminPayments(status) {
    status = status === undefined ? 'pending' : status;
    return swr('pay_' + status, () => api('apiListPayments', status), (rows) => drawPayments(status, rows));
  }
  function drawPayments(status, rows) {
    $('#view').innerHTML = `
      ${sec('สลิปโอนเงิน', `<select id="pf" style="width:auto"><option value="pending">รอตรวจ</option><option value="">ทั้งหมด</option></select>`)}
      <div class="card">${rows.length ? rows.map((p) => `
        <div class="list-item">
          <div class="li">
            <span class="ic">${ic('card')}</span>
            <div class="grow">
              <div class="row spread"><strong>ห้อง ${esc(p.roomId)} · ${fmt(p.amount)} ฿</strong>${pill(p.status)}</div>
              <div class="muted">บิล ${thMonth(p.month)} · ส่งเมื่อ ${thDate(p.uploadedAt)}${p.note ? ' · ' + esc(p.note) : ''}</div>
            </div>
          </div>
          <div class="row" style="margin-top:8px;padding-left:52px">
            <button type="button" class="small ghost" data-file="${esc(p.fileId)}" data-title="สลิป ห้อง ${esc(p.roomId)}">ดูสลิป</button>
            ${p.status === 'pending' ? `<button type="button" class="small" data-ok="${esc(p.id)}">อนุมัติ</button>
            <button type="button" class="small danger" data-no="${esc(p.id)}">ไม่ผ่าน</button>` : ''}
          </div>
        </div>`).join('') : '<span class="muted">ไม่มีรายการ</span>'}</div>`;
    $('#pf').value = status;
    $('#pf').onchange = (e) => adminPayments(e.target.value).catch(fail);
    $$('[data-ok]').forEach((b) => { b.onclick = () => busy(b, async () => { await api('apiReviewPayment', b.dataset.ok, true, ''); toast('อนุมัติแล้ว'); await adminPayments(status); loadAdmin(); }); });
    $$('[data-no]').forEach((b) => {
      b.onclick = () => {
        const note = prompt('เหตุผลที่ไม่ผ่าน (ผู้เช่าจะเห็น)', 'ยอดเงินไม่ตรง');
        if (note === null) return;
        busy(b, async () => { await api('apiReviewPayment', b.dataset.no, false, note); toast('บันทึกแล้ว'); await adminPayments(status); loadAdmin(); });
      };
    });
  }

  // ---------- ซ่อม ----------
  function repairRow(r) {
    return `<div class="list-item li" ${state.role === 'admin' ? `data-repair="${esc(r.id)}"` : ''}>
      <span class="ic">${ic('wrench')}</span>
      <div class="grow">
        <div class="row spread"><strong>${state.role === 'admin' && r.roomId ? 'ห้อง ' + esc(r.roomId) + ' · ' : ''}${esc(r.title)}</strong>${pill(r.status)}</div>
        <div class="muted" style="font-size:14px">${thDate(r.date)}${r.parts ? ' · อะไหล่: ' + esc(r.parts) : ''}${r.cost ? ' · ' + fmt(r.cost) + ' ฿' : ''}${r.reportedBy === 'tenant' ? ' · ผู้เช่าแจ้ง' : ''}</div>
      </div>
    </div>`;
  }

  function adminRepairs(onlyOpen) {
    onlyOpen = onlyOpen === undefined ? true : onlyOpen;
    return swr('rep_' + onlyOpen, () => api('apiListRepairs', onlyOpen), (rows) => drawRepairs(onlyOpen, rows));
  }
  function drawRepairs(onlyOpen, rows) {
    $('#view').innerHTML = `
      ${sec('งานซ่อม', `<select id="rf" style="width:auto"><option value="1">ยังไม่เสร็จ</option><option value="0">ทั้งหมด</option></select>
        <button type="button" id="addR">${ic('plus')} เพิ่ม</button>`)}
      <div class="card">${rows.length ? rows.map(repairRow).join('') : '<span class="muted">ไม่มีรายการ</span>'}</div>`;
    $('#rf').value = onlyOpen ? '1' : '0';
    $('#rf').onchange = (e) => adminRepairs(e.target.value === '1').catch(fail);
    $('#addR').onclick = () => repairForm({});
    $$('[data-repair]').forEach((el) => { el.onclick = () => repairForm(rows.find((x) => x.id === el.dataset.repair)); });
  }

  function repairForm(r) {
    r = r || {};
    const rooms = (state.admin && state.admin.rooms) || [];
    const b = openModal(r.id ? 'แก้ไขงานซ่อม' : 'บันทึกงานซ่อม', `
      <form id="repForm">
        <div class="grid2">
          <div><label>ห้อง</label>
            <select name="roomId" required>${rooms.map((x) => `<option value="${esc(x.id)}" ${x.id === r.roomId ? 'selected' : ''}>${esc(x.number)}</option>`).join('')}</select></div>
          <div><label>วันที่</label><input name="date" type="date" value="${esc(r.date || today())}"></div>
        </div>
        <label>เรื่อง *</label><input name="title" required value="${esc(r.title)}" placeholder="เช่น แอร์ไม่เย็น, ก๊อกน้ำรั่ว">
        <label>รายละเอียด</label><textarea name="detail">${esc(r.detail)}</textarea>
        <label>อะไหล่ที่เปลี่ยน</label><input name="parts" value="${esc(r.parts)}" placeholder="เช่น คาปาซิเตอร์แอร์ 35uF">
        <div class="grid2">
          <div><label>ค่าใช้จ่าย (บาท)</label><input name="cost" type="number" step="any" value="${esc(r.cost || '')}"></div>
          <div><label>สถานะ</label><select name="status">${['reported', 'in_progress', 'done'].map((s) => `<option value="${s}" ${(r.status || 'done') === s ? 'selected' : ''}>${STATUS[s]}</option>`).join('')}</select></div>
        </div>
        <label>แนบรูป</label><input name="photos" type="file" accept="image/\x2a" multiple>
        ${(r.photoIds || []).length ? `<div class="thumbs">${r.photoIds.map((id, i) => `<button type="button" class="small ghost" data-file="${esc(id)}" data-title="รูปที่ ${i + 1}">รูปที่ ${i + 1}</button>`).join('')}</div>` : ''}
        <p><button type="submit">บันทึก</button></p>
      </form>`);
    $('#repForm', b).onsubmit = (e) => {
      e.preventDefault();
      const f = formData(e.target);
      delete f.photos;
      f.id = r.id || '';
      busy($('button[type=submit]', e.target), async () => {
        const photos = await readFiles($('[name=photos]', e.target));
        await api('apiSaveRepair', f, photos);
        toast('บันทึกแล้ว');
        closeModal();
        if (state.tab === 'repairs') adminRepairs();
        else loadAdmin();
      });
    };
  }

  // ---------- ตั้งค่า ----------
  function adminSettings() {
    return swr('admin', loadAdmin, (d) => drawSettings(d.settings));
  }
  function drawSettings(s) {
    // หมายเหตุ: Apps Script ลบคอมเมนต์ในสคริปต์ก่อนส่งไปเบราว์เซอร์ และแยกไม่ออกว่าอยู่ในสตริง
    // จึงห้ามมีสองตัวนี้ในโค้ด: ทับสองตัวติดกัน (ใช้ :\/\/ แทน) และทับตามด้วยดอกจัน (ใช้ /\x2a แทน)
    const docUrl = (id) => id ? `https:\/\/docs.google.com/document/d/${encodeURIComponent(id)}/edit` : '';
    $('#view').innerHTML = `
      ${sec('ตั้งค่า')}
      <form id="setForm" class="cols">
        <div class="card" style="margin:0">
          <label>ชื่อหอพัก</label><input name="dormName" value="${esc(s.dormName)}">
          <label>ที่อยู่หอพัก</label><textarea name="dormAddress">${esc(s.dormAddress)}</textarea>
          <div class="grid2">
            <div><label>ชื่อผู้ให้เช่า (ในสัญญา)</label><input name="ownerName" value="${esc(s.ownerName)}"></div>
            <div><label>เบอร์โทร</label><input name="phone" value="${esc(s.phone)}"></div>
          </div>
          <label>ข้อมูลบัญชีรับโอน</label><textarea name="bankInfo">${esc(s.bankInfo)}</textarea>
          <label>สีหลัก</label><input name="primaryColor" type="color" value="${esc(s.primaryColor)}" style="height:44px">
        </div>
        <div class="card" style="margin:0">
          <div class="li"><span class="ic">${ic('bolt')}</span><strong>ค่าน้ำ / ค่าไฟ</strong></div>
          <div class="grid2">
            <div><label>ค่าน้ำ บาท/หน่วย</label><input name="waterRate" type="number" step="any" value="${esc(s.waterRate)}"></div>
            <div><label>ค่าน้ำขั้นต่ำ/เดือน</label><input name="waterMinCharge" type="number" step="any" value="${esc(s.waterMinCharge)}"></div>
            <div><label>ค่าไฟ บาท/หน่วย</label><input name="electricRate" type="number" step="any" value="${esc(s.electricRate)}"></div>
            <div><label>ค่าไฟขั้นต่ำ/เดือน</label><input name="electricMinCharge" type="number" step="any" value="${esc(s.electricMinCharge)}"></div>
            <div><label>ชำระภายในวันที่ (ของเดือนถัดไป)</label><input name="dueDay" type="number" min="1" max="28" value="${esc(s.dueDay)}"></div>
          </div>
          <label>ค่าใช้จ่ายอื่นรายเดือน (บรรทัดละรายการ: ชื่อ=จำนวนเงิน)</label>
          <textarea name="otherFees" placeholder="ค่าส่วนกลาง=100&#10;ค่าอินเทอร์เน็ต=200">${esc((s.otherFees || []).map((f) => f.name + '=' + f.amount).join('\n'))}</textarea>
          <p style="margin-top:18px"><button type="submit">บันทึกการตั้งค่า</button></p>
        </div>
      </form>
      <div class="card" style="margin-top:16px">
        <div class="li"><span class="ic">${ic('file')}</span><div><strong>แม่แบบเอกสาร</strong><div class="muted" style="font-size:14px">แก้ข้อความได้ใน Google Docs โดยคงตัวแทน {{...}} ไว้</div></div></div>
        <p class="row">
          ${s.invoiceTemplateId ? `<a class="btn ghost" target="_blank" rel="noopener" href="${docUrl(s.invoiceTemplateId)}">แม่แบบใบแจ้งหนี้</a>` : ''}
          ${s.contractTemplateId ? `<a class="btn ghost" target="_blank" rel="noopener" href="${docUrl(s.contractTemplateId)}">แม่แบบสัญญาเช่า</a>` : ''}
          ${s.rootFolderId ? `<a class="btn ghost" target="_blank" rel="noopener" href="https:\/\/drive.google.com/drive/folders/${encodeURIComponent(s.rootFolderId)}">โฟลเดอร์ Drive</a>` : ''}
        </p>
      </div>`;
    $('#setForm').onsubmit = (e) => {
      e.preventDefault();
      const f = formData(e.target);
      f.otherFees = String(f.otherFees || '').split('\n').map((l) => {
        const i = l.lastIndexOf('=');
        return i > 0 ? { name: l.slice(0, i).trim(), amount: Number(l.slice(i + 1)) || 0 } : null;
      }).filter(Boolean);
      busy($('button[type=submit]', e.target), async () => {
        const ns = await api('apiSaveSettings', f);
        document.documentElement.style.setProperty('--accent', ns.primaryColor);
        $('#title').textContent = ns.dormName;
        toast('บันทึกแล้ว');
      });
    };
  }

  // =====================================================
  // ผู้เช่า
  // =====================================================
  async function loadTenant() {
    state.tenant = await api('apiTenantHome');
    return state.tenant;
  }

  function tenantBills() {
    return swr('tenant', loadTenant, drawTenantBills);
  }
  function drawTenantBills(d) {
    state.tenant = d;
    const unpaid = d.invoices.filter((i) => i.status !== 'paid');
    const due = unpaid.filter((i) => i.status === 'unpaid');
    const dueTotal = due.reduce((s, i) => s + Number(i.total || 0), 0);
    const first = due[0];
    $('#view').innerHTML = `
      <section class="hero">
        <span class="eyebrow">ห้อง ${esc(d.roomId)} · ${esc(d.tenancy.tenantName)}</span>
        ${due.length ? `
          <p style="margin-top:14px">ยอดค้างชำระ${due.length > 1 ? ' (' + due.length + ' บิล)' : ''}</p>
          <div class="hero-big">${fmt(dueTotal)} <span style="font-size:.5em">บาท</span></div>
          <p>ครบกำหนด ${thDate(first.dueDate)}</p>
          <div class="hero-actions"><button type="button" data-slip="${esc(first.id)}">${ic('upload')} แนบสลิป ${thMonth(first.month)}</button></div>`
        : `<h1>ไม่มียอดค้างชำระ</h1>${unpaid.length ? '<p>สลิปรอตรวจสอบ</p>' : ''}`}
        <div class="stat" style="margin-top:18px;align-items:flex-start">
          <span class="ic">${ic('card')}</span>
          <div><span>ชำระโดยโอนเข้า</span><div style="white-space:pre-line;color:#fff;font-weight:600">${esc(d.settings.bankInfo)}</div></div>
        </div>
      </section>
      ${sec('ใบแจ้งหนี้')}
      <div class="cols">
      ${d.invoices.length ? d.invoices.map((i) => {
        const pays = d.payments.filter((p) => p.invoiceId === i.id);
        return `<div class="card bill" style="margin:0">
          <div class="row spread"><div class="li"><span class="ic">${ic('bill')}</span><div><strong>${thMonth(i.month)}</strong><div class="muted" style="font-size:14px">ครบกำหนด ${thDate(i.dueDate)}</div></div></div>${pill(i.status)}</div>
          <div class="bill-amt" style="margin-top:10px">${fmt(i.total)} <span class="muted" style="font-size:16px">บาท</span></div>
          <div class="bill-lines">
            ${(i.items || []).map((it) => `<div class="row spread"><span>${esc(it.name)} <span class="muted">${esc(it.detail)}</span></span><span>${fmt(it.amount)}</span></div>`).join('')}
          </div>
          ${pays.map((p) => `<div class="muted" style="font-size:14px;margin-top:6px">${ic('upload')} สลิป ${thDate(p.uploadedAt)} · ${fmt(p.amount)} ฿ · ${STATUS[p.status]}${p.note ? ' (' + esc(p.note) + ')' : ''}</div>`).join('')}
          <div class="row" style="margin-top:12px">
            ${i.pdfFileId ? `<button type="button" class="small ghost" data-file="${esc(i.pdfFileId)}" data-title="ใบแจ้งหนี้ ${esc(i.month)}">${ic('file')} ใบแจ้งหนี้</button>` : ''}
            ${i.status !== 'paid' ? `<button type="button" class="small" data-slip="${esc(i.id)}">${ic('upload')} แนบสลิป</button>` : ''}
          </div>
        </div>`;
      }).join('') : '<div class="card muted">ยังไม่มีใบแจ้งหนี้</div>'}
      </div>`;
    setBadge('bills', due.length);
    $$('[data-slip]').forEach((b) => { b.onclick = () => slipForm(d.invoices.find((x) => x.id === b.dataset.slip)); });
  }

  function slipForm(inv) {
    const b = openModal('แนบสลิป ' + thMonth(inv.month), `
      <form id="slipForm">
        <label>ยอดที่โอน (บาท)</label><input name="amount" type="number" step="any" value="${esc(inv.total)}">
        <label>รูปสลิป</label><input name="file" type="file" accept="image/\x2a,application/pdf" required>
        <p><button type="submit">ส่งสลิป</button></p>
      </form>`);
    $('#slipForm', b).onsubmit = (e) => {
      e.preventDefault();
      busy($('button[type=submit]', e.target), async () => {
        const [file] = await readFiles($('[name=file]', e.target));
        if (!file) throw new Error('กรุณาเลือกรูปสลิป');
        await api('apiUploadSlip', inv.id, file, $('[name=amount]', e.target).value);
        closeModal();
        toast('ส่งสลิปแล้ว รอผู้ดูแลตรวจสอบ');
        tenantBills();
      });
    };
  }

  function tenantRepair() {
    return swr('tenant', loadTenant, drawTenantRepair);
  }
  function drawTenantRepair(d) {
    state.tenant = d;
    $('#view').innerHTML = `
      ${sec('แจ้งซ่อม')}
      <div class="cols">
        <form id="trForm" class="card" style="margin:0">
          <label style="margin-top:0">เรื่อง *</label><input name="title" required placeholder="เช่น ไฟห้องน้ำไม่ติด">
          <label>รายละเอียด</label><textarea name="detail"></textarea>
          <label>แนบรูป (ไม่เกิน 3 รูป)</label><input name="photos" type="file" accept="image/\x2a" multiple>
          <p style="margin-top:16px"><button type="submit" style="width:100%">ส่งเรื่องแจ้งซ่อม</button></p>
        </form>
        <div>
          <h3 style="margin-top:0">ประวัติแจ้งซ่อม</h3>
          <div class="card">${d.repairs.length ? d.repairs.map(repairRow).join('') : '<span class="muted">ยังไม่มี</span>'}</div>
        </div>
      </div>`;
    $('#trForm').onsubmit = (e) => {
      e.preventDefault();
      const f = formData(e.target);
      delete f.photos;
      busy($('button[type=submit]', e.target), async () => {
        const photos = await readFiles($('[name=photos]', e.target));
        await api('apiReportRepair', f, photos);
        toast('ส่งเรื่องแล้ว');
        tenantRepair();
      });
    };
  }

  function tenantMe() {
    return swr('tenant', loadTenant, drawTenantMe);
  }
  function drawTenantMe(d) {
    state.tenant = d;
    $('#view').innerHTML = `
      ${sec('ห้องของฉัน')}
      <div class="cols">
        <div class="card" style="margin:0">
          <div class="tenant-head"><span class="avatar">${initial(d.tenancy.tenantName)}</span>
            <div><strong style="font-size:18px">${esc(d.tenancy.tenantName)}</strong><div class="muted">ห้อง ${esc(d.roomId)}</div></div></div>
          <div class="list-item li" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)"><span class="ic">${ic('door')}</span><div><div class="muted" style="font-size:13px">ย้ายเข้าเมื่อ</div><strong>${thDate(d.tenancy.moveIn)}</strong></div></div>
          <div class="list-item li"><span class="ic">${ic('bill')}</span><div><div class="muted" style="font-size:13px">ค่าเช่า</div><strong>${fmt(d.tenancy.rent)} บาท/เดือน</strong></div></div>
          ${d.tenancy.contractFileId ? `<p style="margin-top:14px"><button type="button" class="ghost" data-file="${esc(d.tenancy.contractFileId)}" data-title="สัญญาเช่า">${ic('file')} ดูสัญญาเช่า</button></p>` : ''}
        </div>
        <div class="card li" style="margin:0"><span class="ic">${ic('phone')}</span><div class="grow"><div class="muted" style="font-size:13px">ติดต่อผู้ดูแลหอ</div><strong>${esc(d.settings.phone)}</strong></div>
          ${d.settings.phone && d.settings.phone !== '-' ? `<a class="btn small" href="tel:${esc(d.settings.phone.replace(/[^0-9+]/g, ''))}">โทร</a>` : ''}</div>
      </div>`;
  }

  // ================= เริ่มทำงาน =================
  (async function boot() {
    state.token = Store.get() || await Store.fromShell();
    if (!state.token) return showLogin();
    // จำบทบาทไว้ในเครื่องแล้ว: เปิดหน้าได้เลย ไม่ต้องถามเซิร์ฟเวอร์ก่อน
    // (ถ้า session หมดอายุ คำขอแรกจะตอบ AUTH แล้วเด้งไปหน้าเข้าสู่ระบบเอง)
    const me = Store.getMe();
    if (me && me.role) {
      state.roomId = me.roomId || '';
      return start(me.role);
    }
    try {
      const who = await run('apiWhoAmI', state.token);
      state.roomId = who.roomId || '';
      Store.set(state.token);
      Store.setMe({ role: who.role, roomId: state.roomId });
      start(who.role);
    } catch (e) {
      showLogin();
    }
  })();
})();
</script>
