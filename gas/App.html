<script>
(function () {
  'use strict';

  // ================= ตัวช่วย =================
  const $ = (s, el) => (el || document).querySelector(s);
  const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g,
    (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = (n) => Number(n || 0).toLocaleString('th-TH', { maximumFractionDigits: 2 });
  const TH_M = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
  const thDate = (iso) => {
    if (!iso) return '-';
    const p = String(iso).slice(0, 10).split('-').map(Number);
    return p[2] + ' ' + TH_M[p[1] - 1] + ' ' + String(p[0] + 543).slice(-2);
  };
  const thMonth = (ym) => { const p = ym.split('-').map(Number); return TH_M[p[1] - 1] + ' ' + (p[0] + 543); };
  const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
  const thisMonth = () => today().slice(0, 7);

  const STATUS = {
    paid: 'ชำระแล้ว', pending: 'รอตรวจสลิป', unpaid: 'ค้างชำระ', approved: 'อนุมัติ', rejected: 'ไม่ผ่าน',
    reported: 'แจ้งแล้ว', in_progress: 'กำลังซ่อม', done: 'เสร็จแล้ว',
    occupied: 'มีผู้เช่า', vacant: 'ว่าง', maintenance: 'ปิดปรับปรุง', active: 'พักอยู่', ended: 'ย้ายออกแล้ว',
    cancelled: 'ยกเลิก',
  };
  const fmtQ = (n) => { const x = Number(n) || 0; return Number.isInteger(x) ? String(x) : x.toFixed(2); };
  const pill = (s) => `<span class="pill s-${esc(s)}">${esc(STATUS[s] || s || '-')}</span>`;

  // ไอคอนเส้น (24x24)
  const ICONS = {
    home: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/>',
    door: '<path d="M6 21V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v17"/><path d="M3 21h18"/><circle cx="14.5" cy="12" r=".8" fill="currentColor"/>',
    bill: '<path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 7h6M9 11h6M9 15h4"/>',
    card: '<rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19M6 15h4"/>',
    wrench: '<path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L3.5 17.3a1.8 1.8 0 0 0 2.5 2.5l5.8-5.8a4 4 0 0 0 5.2-5.4l-2.6 2.6-2.4-.3-.3-2.4z"/>',
    gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3h0a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8v0a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>',
    user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
    users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6.5 6.5 0 0 1 3.5 6"/>',
    drop: '<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
    bolt: '<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
    check: '<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',
    shield: '<path d="M12 3 4 6v6c0 4.5 3.4 8.3 8 9 4.6-.7 8-4.5 8-9V6z"/><path d="m9 12 2 2 4-4"/>',
    phone: '<path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/>',
    file: '<path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4M9 13h6M9 17h6"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
    upload: '<path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v4h16v-4"/>',
    chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  };
  const ic = (name) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ''}</svg>`;
  const sec = (title, right) => `<div class="sec"><h2>${title}</h2>${right ? `<div class="row">${right}</div>` : ''}</div>`;
  const initial = (name) => esc(String(name || '?').replace(/^(นาย|นางสาว|นาง|น\.ส\.)\s*/, '').trim().charAt(0) || '?');

  const PUB = window.PUB || {};
  const SHELL = PUB.shellOrigin || ''; // origin ของหน้า GitHub Pages
  if (PUB.primaryColor) document.documentElement.style.setProperty('--accent', PUB.primaryColor);
  $('#title').textContent = PUB.dormName || 'หอพัก';

  const state = { token: null, role: null, tab: null, admin: null, cache: {}, dirty: false };
  // จำว่าผู้ใช้เริ่มพิมพ์ในฟอร์มแล้ว จะได้ไม่วาดหน้าทับตอนข้อมูลใหม่มาถึง
  document.getElementById('view').addEventListener('input', () => { state.dirty = true; });

  // ================= เก็บ token =================
  // เก็บใน localStorage ของ iframe และส่งให้หน้า PWA shell เก็บสำรองด้วย
  // (Safari อาจล้าง storage ของ iframe ข้ามโดเมน)
  const Store = {
    get() { try { return localStorage.getItem('dormToken'); } catch (e) { return null; } },
    set(t) {
      try { t ? localStorage.setItem('dormToken', t) : localStorage.removeItem('dormToken'); } catch (e) { /* ignore */ }
      if (SHELL) try { window.top.postMessage({ type: 'dorm-token', token: t || '' }, SHELL); } catch (e) { /* ignore */ }
    },
    getMe() {
      try { return JSON.parse(localStorage.getItem('dormMe') || 'null'); } catch (e) { return null; }
    },
    setMe(me) {
      try { me ? localStorage.setItem('dormMe', JSON.stringify(me)) : localStorage.removeItem('dormMe'); } catch (e) { /* ignore */ }
    },
    fromShell() {
      if (!SHELL) return Promise.resolve(null);
      // ไม่ได้เปิดผ่านหน้า PWA (เช่น เปิดลิงก์ Apps Script ตรง ๆ) ก็ไม่ต้องรอ
      const anc = location.ancestorOrigins;
      if (anc && anc.length && anc[anc.length - 1] !== SHELL) return Promise.resolve(null);
      return new Promise((resolve) => {
        const h = (e) => {
          if (e.origin !== SHELL || !e.data || e.data.type !== 'dorm-token-reply') return;
          window.removeEventListener('message', h);
          resolve(e.data.token || null);
        };
        window.addEventListener('message', h);
        try { window.top.postMessage({ type: 'dorm-ready' }, SHELL); } catch (e) { /* ignore */ }
        setTimeout(() => { window.removeEventListener('message', h); resolve(null); }, 500);
      });
    },
  };

  // ================= เรียก Apps Script =================
  function run(fn, ...args) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler((err) => {
          const msg = (err && err.message) || String(err);
          if (msg.indexOf('AUTH:') >= 0) {
            Store.set(null);
            Store.setMe(null);
            state.token = null;
            setTimeout(showLogin, 0);
          }
          reject(new Error(msg.replace(/^.*AUTH:\s*/, '')));
        })[fn](...args);
    });
  }
  // คำสั่งที่แก้ข้อมูล ให้ล้างข้อมูลที่จำไว้ทั้งหมด หน้าถัดไปจะได้ไม่โชว์ของเก่า
  const READ_ONLY = /^api(Get|List|AdminBootstrap|RoomDetail|TenantHome|WhoAmI|Account)/;
  async function api(fn, ...args) {
    const res = await run(fn, state.token, ...args);
    if (!READ_ONLY.test(fn)) state.cache = {};
    return res;
  }

  /**
   * แสดงข้อมูลที่จำไว้ทันที แล้วโหลดของใหม่มาแทนเบื้องหลัง
   * ถ้าข้อมูลไม่เปลี่ยน หรือผู้ใช้กำลังกรอกฟอร์มอยู่ จะไม่วาดทับ
   */
  async function swr(key, fetcher, draw) {
    const tab = state.tab;
    const old = state.cache[key];
    if (old) { state.dirty = false; draw(old.data); }
    const data = await fetcher();
    const json = JSON.stringify(data);
    state.cache[key] = { data, json };
    if (state.tab !== tab) return;
    if (old && (old.json === json || state.dirty)) return;
    state.dirty = false;
    draw(data);
  }

  function toast(msg, isErr) {
    const t = $('#toast');
    t.textContent = msg;
    t.className = isErr ? 'err' : '';
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.add('hidden'), isErr ? 5000 : 2500);
  }
  const fail = (e) => toast(e.message || String(e), true);

  /** ปิดปุ่มระหว่างรอ */
  async function busy(btn, fn) {
    const old = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'กำลังทำงาน…';
    try { return await fn(); } catch (e) { fail(e); } finally { btn.disabled = false; btn.textContent = old; }
  }

  // ================= modal =================
  function openModal(title, html) {
    $('#modalTitle').textContent = title;
    $('#modalBody').innerHTML = html;
    $('#modal').classList.remove('hidden');
    return $('#modalBody');
  }
  function closeModal() {
    $('#modal').classList.add('hidden');
    $('#modalBody').innerHTML = '';
  }
  $('#modal').addEventListener('click', (e) => {
    if (e.target.id === 'modal' || e.target.hasAttribute('data-close')) closeModal();
  });

  const formData = (form) => Object.fromEntries(new FormData(form).entries());

  // ================= ไฟล์ =================
  function loadImg(file) {
    return new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => { URL.revokeObjectURL(img.src); res(img); };
      img.onerror = rej;
      img.src = URL.createObjectURL(file);
    });
  }
  /** อ่านไฟล์เป็น base64 ย่อรูปให้ด้านยาวไม่เกิน 1600px */
  async function readFile(file, maxPx) {
    maxPx = maxPx || 1600;
    if (/^image\/(jpeg|png|webp|heic|heif)/.test(file.type)) {
      try {
        const img = await loadImg(file);
        const s = Math.min(1, maxPx / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s);
        c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        return { name: file.name.replace(/\.\w+$/, '') + '.jpg', mimeType: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.85).split(',')[1] };
      } catch (e) { /* ใช้ไฟล์เดิม */ }
    }
    const data = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(String(r.result).split(',')[1]);
      r.onerror = rej;
      r.readAsDataURL(file);
    });
    return { name: file.name, mimeType: file.type, data };
  }
  const readFiles = (input, maxPx) => Promise.all(Array.from(input.files || []).map((f) => readFile(f, maxPx)));

  // รายการไฟล์สัญญาที่เซ็นแล้ว (กดเปิดดูได้)
  const signedList = (list, showRetain) => (list || []).length ? `<div class="thumbs">${list.map((c, i) => `
    <button type="button" class="small ghost" data-file="${esc(c.fileId)}" data-title="สัญญาที่เซ็นแล้ว หน้า ${i + 1}"
      title="อัปโหลด ${thDate(c.uploadedAt)}${c.retainUntil ? ' · เก็บถึง ' + thDate(c.retainUntil) : ' · เก็บถึง 10 ปีหลังย้ายออก'}">${ic('file')} หน้า ${i + 1}</button>`).join('')}</div>
    ${showRetain !== false ? `<div class="muted" style="font-size:12px;margin-top:4px">${list.map((c, i) => `หน้า ${i + 1}: เข้าระบบ ${thDate(c.uploadedAt)}${c.retainUntil ? ' · เก็บถึง ' + thDate(c.retainUntil) : ' · เก็บถึง 10 ปีหลังย้ายออก'}`).join(' | ')}</div>` : ''}` : '';

  // PDF แสดงใน iframe ไม่ได้ (Chrome/มือถือบล็อกใน sandbox ของ Apps Script) จึงวาดเองด้วย PDF.js
  const PDFJS = 'https:\/\/cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  let pdfjsReady = null;
  function loadPdfJs() {
    if (!pdfjsReady) {
      pdfjsReady = new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = PDFJS + 'pdf.min.js';
        s.onload = () => {
          window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js';
          resolve(window.pdfjsLib);
        };
        s.onerror = () => { pdfjsReady = null; reject(new Error('โหลดตัวแสดง PDF ไม่ได้ ลองใหม่อีกครั้ง')); };
        document.head.appendChild(s);
      });
    }
    return pdfjsReady;
  }

  async function renderPdf(bytes, box) {
    const lib = await loadPdfJs();
    const pdf = await lib.getDocument({ data: bytes, cMapUrl: PDFJS + 'cmaps/', cMapPacked: true }).promise;
    box.innerHTML = '';
    const width = box.clientWidth || 600;
    const ratio = Math.min(window.devicePixelRatio || 1, 2);
    for (let n = 1; n <= pdf.numPages; n++) {
      const page = await pdf.getPage(n);
      const base = page.getViewport({ scale: 1 });
      const vp = page.getViewport({ scale: (width / base.width) * ratio });
      const c = document.createElement('canvas');
      c.width = Math.floor(vp.width);
      c.height = Math.floor(vp.height);
      c.style.width = '100%';
      box.appendChild(c);
      await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    }
  }

  async function viewFile(fileId, title) {
    const body = openModal(title || 'ไฟล์', '<div class="center muted">กำลังโหลดไฟล์…</div>');
    try {
      const f = await api('apiGetFile', fileId);
      const bin = atob(f.data);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const url = URL.createObjectURL(new Blob([bytes], { type: f.mimeType }));
      const isImg = f.mimeType.indexOf('image/') === 0;
      const isPdf = f.mimeType === 'application/pdf';
      body.innerHTML = `<div class="viewer">${isImg ? `<img src="${url}" alt="">` : isPdf ? '<div class="pdf-pages"><div class="center muted">กำลังแสดง PDF…</div></div>' : ''}</div>
        <p><a class="btn ghost" href="${url}" download="${esc(f.name)}">ดาวน์โหลด ${esc(f.name)}</a></p>`;
      if (isPdf) {
        const box = $('.pdf-pages', body);
        try { await renderPdf(bytes.slice(), box); } catch (err) { box.innerHTML = `<p class="muted">แสดง PDF ไม่ได้ (${esc(err.message)}) กดดาวน์โหลดเพื่อเปิดดูแทน</p>`; }
      }
    } catch (e) { body.innerHTML = `<p class="muted">${esc(e.message)}</p>`; }
  }
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-file]');
    if (b) viewFile(b.dataset.file, b.dataset.title);
  });

  // ================= แท็บ =================
  // เมนูเดียวกันแสดง 2 แบบ: แถบบน (คอม) และแท็บล่าง (มือถือ)
  function setTabs(tabs) {
    const badge = (t) => `<span class="badge hidden" data-badge="${t.id}"></span>`;
    $('#tabs').innerHTML = tabs.map((t) => `<button type="button" data-tab="${t.id}"><span class="ico">${ic(t.ico)}</span><span>${t.label}</span>${badge(t)}</button>`).join('');
    $('#topnav').innerHTML = tabs.map((t) => `<button type="button" data-tab="${t.id}">${ic(t.ico)}<span>${t.label}</span>${badge(t)}</button>`).join('');
    ['#tabs', '#topnav'].forEach((sel) => {
      const nav = $(sel);
      nav.classList.remove('hidden');
      nav.onclick = (e) => { const b = e.target.closest('[data-tab]'); if (b) go(b.dataset.tab); };
    });
    state.tabs = tabs;
  }
  function setBadge(id, n) {
    $$(`[data-badge="${id}"]`).forEach((el) => {
      el.textContent = n;
      el.classList.toggle('hidden', !n);
    });
  }
  function go(id) {
    state.tab = id;
    $$('[data-tab]').forEach((b) => b.classList.toggle('active', b.dataset.tab === id));
    const t = state.tabs.find((x) => x.id === id);
    $('#view').innerHTML = '<div class="center muted">กำลังโหลด…</div>';
    window.scrollTo(0, 0);
    Promise.resolve(t.render()).catch((e) => { $('#view').innerHTML = `<div class="center muted">${esc(e.message)}</div>`; });
  }

  // ================= เข้าสู่ระบบ =================
  function showLogin() {
    state.role = null;
    state.cache = {};
    state.admin = null;
    state.tenant = null;
    ['#tabs', '#topnav', '#logoutBtn', '#who'].forEach((s) => $(s).classList.add('hidden'));
    closeModal();
    $('#view').innerHTML = `
      <div class="auth">
        <section class="hero">
          <h1>${esc(PUB.dormName || 'หอพัก')}</h1>
          <p>ผู้เช่าใช้ดูบิล ส่งสลิป และแจ้งซ่อม</p>
          <div class="feat">
            <div><span class="ic">${ic('bill')}</span>ใบแจ้งค่าเช่า ค่าน้ำ ค่าไฟ รายเดือน</div>
            <div><span class="ic">${ic('upload')}</span>ส่งสลิปโอนเงิน</div>
            <div><span class="ic">${ic('wrench')}</span>แจ้งซ่อม</div>
          </div>
        </section>
        <section class="card auth-form">
          <h2>เข้าสู่ระบบ</h2>
          <div class="seg"><button type="button" class="on" data-mode="tenant">ผู้เช่า</button><button type="button" data-mode="admin">ผู้ดูแลหอ</button></div>
          <form id="loginForm" autocomplete="on">
            <div data-for="tenant">
              <label>เลขห้อง</label><input name="roomId" inputmode="numeric" autocomplete="username" placeholder="เช่น 101">
              <label>PIN 6 หลัก</label><input name="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password" placeholder="••••••">
              <div class="muted" style="font-size:13px;margin-top:6px">ขอ PIN ได้ที่ผู้ดูแลหอ ${PUB.phone && PUB.phone !== '-' ? '· โทร ' + esc(PUB.phone) : ''}</div>
            </div>
            <div data-for="admin" class="hidden">
              <label>อีเมลผู้ดูแล</label><input name="email" type="text" inputmode="email" autocomplete="username" placeholder="name@example.com">
              <label>รหัสผ่าน</label><input name="password" type="password" autocomplete="current-password">
              <div class="muted" style="font-size:13px;margin-top:6px">ตั้งค่าครั้งแรกหรือกู้คืนระบบ: ใส่อีเมลเป็น master และใช้รหัส master</div>
            </div>
            <p style="margin-top:20px"><button type="submit" style="width:100%">เข้าสู่ระบบ ${ic('arrow')}</button></p>
          </form>
        </section>
      </div>`;
    let mode = 'tenant';
    $('.seg').onclick = (e) => {
      const b = e.target.closest('[data-mode]');
      if (!b) return;
      mode = b.dataset.mode;
      $$('.seg button').forEach((x) => x.classList.toggle('on', x === b));
      $$('[data-for]').forEach((x) => x.classList.toggle('hidden', x.dataset.for !== mode));
    };
    $('#loginForm').onsubmit = (e) => {
      e.preventDefault();
      const d = formData(e.target);
      d.mode = mode;
      busy($('#loginForm button[type=submit]'), async () => {
        const r = await run('apiLogin', d);
        state.token = r.token;
        state.roomId = r.roomId || '';
        state.name = r.name || '';
        state.master = !!r.master;
        Store.set(r.token);
        Store.setMe({ role: r.role, roomId: state.roomId, name: state.name, master: state.master });
        start(r.role);
      });
    };
  }

  $('#logoutBtn').onclick = async () => {

  function adminBilling(month) {
    month = month || state.billMonth || thisMonth();
    state.billMonth = month;
    return swr('bill_' + month,
      () => Promise.all([api('apiGetMonthSheet', month), api('apiListInvoices', month), api('apiListCharges', month)]),
      (r) => drawBilling(month, r[0], r[1], r[2]));
  }

    const active = invoices.filter((i) => i.status !== 'cancelled');
    const cancelled = invoices.filter((i) => i.status === 'cancelled');

    charges.forEach((c) => { (byRoom[c.roomId] = byRoom[c.roomId] || []).push(c); });
    const chargeCell = (roomId) => `
      <div class="charges">${(byRoom[roomId] || []).map((c) => `
        <span class="chip-charge">${esc(c.name)} ${fmt(c.amount)}
          <button type="button" class="x" data-delcharge="${esc(c.id)}" aria-label="ลบ ${esc(c.name)}">×</button></span>`).join('')}
        <button type="button" class="small ghost" data-addcharge="${esc(roomId)}">${ic('plus')} เพิ่ม</button>
      </div>`;
    $('#view').innerHTML = `
      ${sec(`จดมิเตอร์ ${thMonth(month)}`, `<input type="month" id="mon" value="${month}" style="width:auto">`)}

      <div class="card scroll-x">
        ${rows.length ? `<table id="meter">
          <thead><tr><th>ห้อง</th><th class="num">${ic('drop')} น้ำ (ก่อน)</th><th>น้ำ (ล่าสุด)</th><th class="num">${ic('bolt')} ไฟ (ก่อน)</th><th>ไฟ (ล่าสุด)</th><th>รายการเพิ่ม</th><th>บิล</th></tr></thead>
          <tbody>${rows.map((r) => `
            <tr data-room="${esc(r.roomId)}">
              <td><strong>${esc(r.roomId)}</strong><div class="muted" style="font-size:13px">${esc(r.tenantName)}</div></td>
              <td class="num">${fmt(r.prevWater)}</td>
              <td><input name="water" type="number" step="any" inputmode="decimal" value="${esc(r.water)}"></td>
              <td class="num">${fmt(r.prevElectric)}</td>
              <td><input name="electric" type="number" step="any" inputmode="decimal" value="${esc(r.electric)}"></td>
              <td>${chargeCell(r.roomId)}</td>

            </tr>`).join('')}</tbody></table>` : '<p class="muted">ยังไม่มีห้องที่มีผู้เช่า</p>'}
      </div>
      <div class="row">
        <button type="button" class="ghost" id="saveMeter">บันทึกเลขมิเตอร์</button>
        <button type="button" id="genInv">${ic('bill')} บันทึก + ออกใบแจ้งหนี้</button>
      </div>
      <div id="genResult" style="margin-top:12px"></div>

      ${sec(`ใบแจ้งหนี้ ${thMonth(month)}`)}
      <div class="card">${active.length ? active.map((i) => `
        <div class="list-item">
          <div class="row spread">
            <div class="grow"><strong>ห้อง ${esc(i.roomId)}</strong> ${esc(i.tenantName)}
              <div class="muted">เลขที่ ${esc(i.number || '-')} · ${fmt(i.total)} บาท · ครบกำหนด ${thDate(i.dueDate)}</div>
              ${i.receiptNo ? `<div class="muted" style="font-size:13px">ใบเสร็จ ${esc(i.receiptNo)} · ยืนยันการโอน ${thDate(i.paidAt)}</div>` : ''}</div>
            <select data-inv="${esc(i.id)}" style="width:auto">
              ${['unpaid', 'pending', 'paid'].map((s) => `<option value="${s}" ${i.status === s ? 'selected' : ''}>${STATUS[s]}</option>`).join('')}
            </select>
          </div>
          <div class="row" style="margin-top:6px">
            ${i.pdfFileId ? `<button type="button" class="small ghost" data-file="${esc(i.pdfFileId)}" data-title="ใบแจ้งหนี้ ${esc(i.number || i.roomId)}">ใบแจ้งหนี้</button>` : ''}
            ${i.receiptPdfId ? `<button type="button" class="small ghost" data-file="${esc(i.receiptPdfId)}" data-title="ใบเสร็จ ${esc(i.receiptNo || '')}">ใบเสร็จ</button>` : ''}
            ${i.status !== 'paid' ? `<button type="button" class="small ghost" data-editinv="${esc(i.id)}">แก้ไข</button>
            <button type="button" class="small ghost" data-cancelinv="${esc(i.id)}" style="color:var(--bad);border-color:var(--bad)">ยกเลิกใบนี้</button>` : ''}
          </div>
        </div>`).join('') : '<span class="muted">ยังไม่ได้ออกใบแจ้งหนี้</span>'}</div>
      ${cancelled.length ? `<details class="card"><summary class="muted">ใบที่ยกเลิกแล้ว (${cancelled.length})</summary>
        ${cancelled.map((i) => `<div class="list-item muted" style="font-size:14px">ห้อง ${esc(i.roomId)} · เลขที่ ${esc(i.number || '-')} · ${fmt(i.total)} บาท · ยกเลิก ${thDate(i.cancelledAt)}${i.cancelReason ? ' (' + esc(i.cancelReason) + ')' : ''}</div>`).join('')}
      </details>` : ''}`;

    $('#mon').onchange = (e) => e.target.value && go_billing(e.target.value);
    const collect = () => $$('#meter tbody tr').map((tr) => ({
      roomId: tr.dataset.room, water: $('[name=water]', tr).value, electric: $('[name=electric]', tr).value,
    }));
    $('#saveMeter').onclick = (e) => busy(e.target, async () => { await api('apiSaveReadings', month, collect()); toast('บันทึกเลขมิเตอร์แล้ว'); });
    $('#genInv').onclick = (e) => {
      if (!confirm('ออกใบแจ้งหนี้ทุกห้องที่จดมิเตอร์แล้ว?')) return;
      busy(e.target, async () => {
        await api('apiSaveReadings', month, collect());
        const res = await api('apiGenerateInvoices', month);
        await adminBilling(month);
        $('#genResult').innerHTML = `<div class="card">${res.map((r) => `<div>ห้อง ${esc(r.roomId)}: ${r.ok ? fmt(r.total) + ' บาท' : '<span style="color:var(--bad)">' + esc(r.error) + '</span>'}</div>`).join('')}</div>`;
      });
    };
    $$('[data-inv]').forEach((sel) => {
      sel.onchange = async () => {
        try { await api('apiSetInvoiceStatus', sel.dataset.inv, sel.value); toast('อัปเดตสถานะแล้ว'); adminBilling(month); } catch (e) { fail(e); }
      };
    });
    $$('[data-addcharge]').forEach((b) => { b.onclick = () => chargeForm({ month, roomId: b.dataset.addcharge }); });
    $$('[data-delcharge]').forEach((b) => {
      b.onclick = () => {
        if (!confirm('ลบรายการนี้?')) return;
        busy(b, async () => { await api('apiDeleteCharge', b.dataset.delcharge); toast('ลบแล้ว'); adminBilling(month); });
      };
    });
    $$('[data-editinv]').forEach((b) => { b.onclick = () => invoiceForm(invoices.find((x) => x.id === b.dataset.editinv), month); });
    $$('[data-cancelinv]').forEach((b) => {
      b.onclick = () => {
        const inv = invoices.find((x) => x.id === b.dataset.cancelinv);
        const reason = prompt(`ยกเลิกใบแจ้งหนี้เลขที่ ${inv.number || '-'} ห้อง ${inv.roomId}?\nเหตุผล (ไม่บังคับ):`, '');
        if (reason === null) return;
        busy(b, async () => { await api('apiCancelInvoice', inv.id, reason); toast('ยกเลิกแล้ว กดออกใบแจ้งหนี้ใหม่ได้'); adminBilling(month); });
      };
    });
  }

  // แก้ใบแจ้งหนี้: เลขที่ + รายการ
  function invoiceForm(inv, month) {
    const rowHtml = (it) => `
      <div class="inv-row row" style="gap:6px;margin-bottom:6px;flex-wrap:nowrap">
        <input name="name" value="${esc(it.name || '')}" placeholder="รายการ" style="flex:3;min-width:0">
        <input name="qty" type="number" step="any" value="${esc(it.qty == null ? 1 : it.qty)}" style="flex:1;min-width:0" aria-label="จำนวน">
        <input name="price" type="number" step="any" value="${esc(it.price == null ? '' : it.price)}" style="flex:1.3;min-width:0" aria-label="ราคา">
        <button type="button" class="small ghost" data-rmrow aria-label="ลบแถว">ลบ</button>
      </div>`;
    const b = openModal('แก้ไขใบแจ้งหนี้ ห้อง ' + inv.roomId, `
      <form id="invForm">
        <label>เลขที่ใบแจ้งหนี้</label><input name="number" value="${esc(inv.number || '')}" required>
        <label>รายการ (ชื่อ · จำนวน · ราคาต่อหน่วย)</label>
        <div id="invRows">${(inv.items || []).map(rowHtml).join('')}</div>
        <button type="button" class="small ghost" id="addRow">${ic('plus')} เพิ่มรายการ</button>
        <p class="muted" id="invTotal" style="margin-top:12px"></p>
        <p><button type="submit">บันทึกและออก PDF ใหม่</button></p>
      </form>`);
    const rowsBox = $('#invRows', b);
    const readRows = () => $$('.inv-row', rowsBox).map((r) => ({
      name: $('[name=name]', r).value, qty: $('[name=qty]', r).value, price: $('[name=price]', r).value,
    }));
    const showTotal = () => {
      const t = readRows().reduce((s, r) => s + (Number(r.qty) || 0) * (Number(r.price) || 0), 0);
      $('#invTotal', b).textContent = 'ยอดรวม ' + fmt(t) + ' บาท';
    };
    rowsBox.addEventListener('input', showTotal);
    rowsBox.addEventListener('click', (e) => { if (e.target.closest('[data-rmrow]')) { e.target.closest('.inv-row').remove(); showTotal(); } });
    $('#addRow', b).onclick = () => { rowsBox.insertAdjacentHTML('beforeend', rowHtml({ qty: 1 })); showTotal(); };
    showTotal();
    $('#invForm', b).onsubmit = (e) => {
      e.preventDefault();
      busy($('button[type=submit]', e.target), async () => {
        await api('apiUpdateInvoice', inv.id, { number: $('[name=number]', e.target).value, items: readRows() });
        closeModal();
        toast('บันทึกแล้ว');
        adminBilling(month);
      });
    };
  }

  // เพิ่มรายการเรียกเก็บของห้อง
  async function chargeForm(pre) {
    if (!state.admin) { try { await loadAdmin(); } catch (e) { return fail(e); } }
    const rooms = ((state.admin && state.admin.rooms) || []).filter((r) => r.status === 'occupied');
    const b = openModal('เพิ่มรายการเรียกเก็บ' + (pre.roomId ? ' ห้อง ' + pre.roomId : ''), `
      <form id="chgForm">
        <div class="grid2">
          <div><label>ห้อง</label><select name="roomId" required>${rooms.map((r) => `<option value="${esc(r.id)}" ${r.id === pre.roomId ? 'selected' : ''}>${esc(r.number)} ${esc(r.tenantName)}</option>`).join('')}</select></div>
          <div><label>เรียกเก็บในบิลเดือน</label><input name="month" type="month" value="${esc(pre.month || thisMonth())}" required></div>
        </div>
        <label>รายการ *</label><input name="name" required value="${esc(pre.name || '')}" placeholder="เช่น ค่าซ่อมประตู">
        <div class="grid2">
          <div><label>จำนวน</label><input name="qty" type="number" step="any" value="1"></div>
          <div><label>ราคาต่อหน่วย (บาท) *</label><input name="price" type="number" step="any" required value="${esc(pre.price || '')}"></div>
        </div>
        <label>หมายเหตุ</label><input name="note" value="${esc(pre.note || '')}">
        <p><button type="submit">บันทึก</button></p>
      </form>`);
    if (!rooms.length) $('#chgForm', b).insertAdjacentHTML('afterbegin', '<p class="muted">ยังไม่มีห้องที่มีผู้เช่า</p>');
    $('#chgForm', b).onsubmit = (e) => {
      e.preventDefault();
      const f = formData(e.target);
      busy($('button[type=submit]', e.target), async () => {
        await api('apiAddCharge', f);
        closeModal();
        toast('เพิ่มแล้ว จะรวมในใบแจ้งหนี้ห้อง ' + f.roomId + ' เดือน ' + thMonth(f.month));
        if (pre.reopenRoom) openRoom(f.roomId);
        else if (state.tab === 'billing') adminBilling(state.billMonth);
      });
    };
  }
  function go_billing(m) { $('#view').innerHTML = '<div class="center muted">กำลังโหลด…</div>'; adminBilling(m).catch(fail); }

  // ---------- สลิป ----------
  function adminPayments(status) {
    status = status === undefined ? 'pending' : status;
    return swr('pay_' + status, () => api('apiListPayments', status), (rows) => drawPayments(status, rows));
  }
  function drawPayments(status, rows) {
    $('#view').innerHTML = `
      ${sec('สลิปโอนเงิน', `<select id="pf" style="width:auto"><option value="pending">รอตรวจ</option><option value="">ทั้งหมด</option></select>`)}
      <div class="card">${rows.length ? rows.map((p) => `
        <div class="list-item">
          <div class="li">
            <span class="ic">${ic('card')}</span>
            <div class="grow">
              <div class="row spread"><strong>ห้อง ${esc(p.roomId)} · ${fmt(p.amount)} ฿</strong>${pill(p.status)}</div>
              <div class="muted">บิล ${thMonth(p.month)} · ส่งเมื่อ ${thDate(p.uploadedAt)}${p.note ? ' · ' + esc(p.note) : ''}${p.receiptNo ? ' · ใบเสร็จ ' + esc(p.receiptNo) : ''}</div>
            </div>
          </div>
          <div class="row" style="margin-top:8px;padding-left:52px">
            <button type="button" class="small ghost" data-file="${esc(p.fileId)}" data-title="สลิป ห้อง ${esc(p.roomId)}">ดูสลิป</button>
            ${p.status === 'pending' ? `<button type="button" class="small" data-ok="${esc(p.id)}">อนุมัติ</button>
            <button type="button" class="small danger" data-no="${esc(p.id)}">ไม่ผ่าน</button>` : ''}
          </div>
        </div>`).join('') : '<span class="muted">ไม่มีรายการ</span>'}</div>`;
    $('#pf').value = status;
    $('#pf').onchange = (e) => adminPayments(e.target.value).catch(fail);
    $$('[data-ok]').forEach((b) => { b.onclick = () => busy(b, async () => { await api('apiReviewPayment', b.dataset.ok, true, ''); toast('อนุมัติแล้ว'); await adminPayments(status); loadAdmin(); }); });
    $$('[data-no]').forEach((b) => {
      b.onclick = () => {
        const note = prompt('เหตุผลที่ไม่ผ่าน (ผู้เช่าจะเห็น)', 'ยอดเงินไม่ตรง');
        if (note === null) return;
        busy(b, async () => { await api('apiReviewPayment', b.dataset.no, false, note); toast('บันทึกแล้ว'); await adminPayments(status); loadAdmin(); });
      };
    });
  }

  // ---------- ซ่อม ----------
  function repairRow(r) {
    return `<div class="list-item li" ${state.role === 'admin' ? `data-repair="${esc(r.id)}"` : ''}>
      <span class="ic">${ic('wrench')}</span>
      <div class="grow">
        <div class="row spread"><strong>${state.role === 'admin' && r.roomId ? 'ห้อง ' + esc(r.roomId) + ' · ' : ''}${esc(r.title)}</strong>${pill(r.status)}</div>
        <div class="muted" style="font-size:14px">${thDate(r.date)}${r.parts ? ' · อะไหล่: ' + esc(r.parts) : ''}${r.cost ? ' · ' + fmt(r.cost) + ' ฿' : ''}${r.reportedBy === 'tenant' ? ' · ผู้เช่าแจ้ง' : ''}</div>
      </div>
    </div>`;
  }

  function adminRepairs(onlyOpen) {
    onlyOpen = onlyOpen === undefined ? true : onlyOpen;
    return swr('rep_' + onlyOpen, () => api('apiListRepairs', onlyOpen), (rows) => drawRepairs(onlyOpen, rows));
  }
  function drawRepairs(onlyOpen, rows) {
    $('#view').innerHTML = `
      ${sec('งานซ่อม', `<select id="rf" style="width:auto"><option value="1">ยังไม่เสร็จ</option><option value="0">ทั้งหมด</option></select>
        <button type="button" id="addR">${ic('plus')} เพิ่ม</button>`)}
      <div class="card">${rows.length ? rows.map(repairRow).join('') : '<span class="muted">ไม่มีรายการ</span>'}</div>`;
    $('#rf').value = onlyOpen ? '1' : '0';
    $('#rf').onchange = (e) => adminRepairs(e.target.value === '1').catch(fail);
    $('#addR').onclick = () => repairForm({});
    $$('[data-repair]').forEach((el) => { el.onclick = () => repairForm(rows.find((x) => x.id === el.dataset.repair)); });
  }

  function repairForm(r) {
    r = r || {};
    const rooms = (state.admin && state.admin.rooms) || [];
    const b = openModal(r.id ? 'แก้ไขงานซ่อม' : 'บันทึกงานซ่อม', `
      <form id="repForm">
        <div class="grid2">
          <div><label>ห้อง</label>
            <select name="roomId" required>${rooms.map((x) => `<option value="${esc(x.id)}" ${x.id === r.roomId ? 'selected' : ''}>${esc(x.number)}</option>`).join('')}</select></div>
          <div><label>วันที่</label><input name="date" type="date" value="${esc(r.date || today())}"></div>
        </div>
        <label>เรื่อง *</label><input name="title" required value="${esc(r.title)}" placeholder="เช่น แอร์ไม่เย็น, ก๊อกน้ำรั่ว">
        <label>รายละเอียด</label><textarea name="detail">${esc(r.detail)}</textarea>
        <label>อะไหล่ที่เปลี่ยน</label><input name="parts" value="${esc(r.parts)}" placeholder="เช่น คาปาซิเตอร์แอร์ 35uF">
        <div class="grid2">
          <div><label>ค่าใช้จ่าย (บาท)</label><input name="cost" type="number" step="any" value="${esc(r.cost || '')}"></div>
          <div><label>สถานะ</label><select name="status">${['reported', 'in_progress', 'done'].map((s) => `<option value="${s}" ${(r.status || 'done') === s ? 'selected' : ''}>${STATUS[s]}</option>`).join('')}</select></div>
        </div>
        <p class="muted" style="font-size:13px;margin:6px 0 0">ค่าใช้จ่ายงานซ่อมจะเข้าบัญชีเป็นรายจ่ายอัตโนมัติ</p>
        ${r.chargeId ? '<p class="muted" style="font-size:14px">เรียกเก็บจากผู้เช่าแล้ว (ดูที่หน้าบิล)</p>' : `
        <label class="row" style="color:var(--text);font-weight:400"><input type="checkbox" name="chargeTenant" id="chkCharge" style="width:auto"> เรียกเก็บจากผู้เช่า (ผู้เช่าทำเสียหาย)</label>
        <div class="grid2 hidden" id="chargeBox">
          <div><label>ยอดเรียกเก็บ (บาท)</label><input name="chargeAmount" type="number" step="any" value="${esc(r.cost || '')}"></div>
          <div><label>รวมในบิลเดือน</label><input name="chargeMonth" type="month" value="${thisMonth()}"></div>
        </div>`}
        <label>แนบรูป</label><input name="photos" type="file" accept="image/\x2a" multiple>
        ${(r.photoIds || []).length ? `<div class="thumbs">${r.photoIds.map((id, i) => `<button type="button" class="small ghost" data-file="${esc(id)}" data-title="รูปที่ ${i + 1}">รูปที่ ${i + 1}</button>`).join('')}</div>` : ''}
        <p><button type="submit">บันทึก</button></p>
      </form>`);
    if ($('#chkCharge', b)) $('#chkCharge', b).onchange = (e) => $('#chargeBox', b).classList.toggle('hidden', !e.target.checked);
    $('#repForm', b).onsubmit = (e) => {
      e.preventDefault();
      const f = formData(e.target);
      delete f.photos;
      f.id = r.id || '';
      f.chargeTenant = !!f.chargeTenant;
      busy($('button[type=submit]', e.target), async () => {
        const photos = await readFiles($('[name=photos]', e.target));
        await api('apiSaveRepair', f, photos);
        toast('บันทึกแล้ว');
        closeModal();
        if (state.tab === 'repairs') adminRepairs();
        else loadAdmin();
      });
    };
  }

  // ---------- บัญชีรายรับ-รายจ่าย ----------
  function adminAccounts(month) {
    month = month || state.accMonth || thisMonth();
    state.accMonth = month;
    const year = month.slice(0, 4);
    return swr('acc_' + month,
      () => Promise.all([api('apiAccountMonth', month), api('apiAccountYear', year)]),
      (r) => drawAccounts(month, r[0], r[1]));
  }
  function drawAccounts(month, d, yearRows) {
    const max = Math.max(1, ...yearRows.map((m) => Math.max(m.income, m.expense)));
    $('#view').innerHTML = `
      ${sec('บัญชีรายรับ-รายจ่าย', `<input type="month" id="accMon" value="${month}" style="width:auto">
        <button type="button" class="small" id="addIn">${ic('plus')} รายรับ</button>
        <button type="button" class="small danger" id="addOut">${ic('plus')} รายจ่าย</button>`)}
      <div class="acc-grid">
        <div class="card"><div class="muted">รายรับ ${thMonth(month)}</div><b class="money-in">${fmt(d.income)}</b>
          <div class="muted" style="font-size:13px">ค่าเช่า ${fmt(d.rentIncome)} · อื่น ๆ ${fmt(d.otherIncome)}</div></div>
        <div class="card"><div class="muted">รายจ่าย</div><b class="money-out">${fmt(d.expense)}</b></div>
        <div class="card"><div class="muted">คงเหลือ</div><b>${fmt(d.net)}</b></div>
        <div class="card"><div class="muted">ค้างรับ</div><b>${fmt(d.outstanding)}</b>
          <div class="muted" style="font-size:13px">${d.unpaidInvoices.length} ใบ</div></div>
      </div>

      <div class="card">
        <div class="row spread"><strong>ปี ${Number(month.slice(0, 4)) + 543}</strong>
          <span class="muted" style="font-size:13px"><span class="pill s-paid">รายรับ</span> <span class="pill s-unpaid">รายจ่าย</span></span></div>
        <div class="bars">${yearRows.map((m) => `
          <div class="m" title="${thMonth(m.month)}: รับ ${fmt(m.income)} จ่าย ${fmt(m.expense)}">
            <div class="pair"><span class="in" style="height:${(m.income / max) * 96}px"></span><span class="out" style="height:${(m.expense / max) * 96}px"></span></div>
            ${TH_M[Number(m.month.slice(5)) - 1]}
          </div>`).join('')}</div>
        <div class="scroll-x"><table style="margin-top:10px;font-size:14px">
          <thead><tr><th>เดือน</th><th class="num">รายรับ</th><th class="num">รายจ่าย</th><th class="num">คงเหลือ</th></tr></thead>
          <tbody>${yearRows.filter((m) => m.income || m.expense).map((m) => `<tr><td>${thMonth(m.month)}</td><td class="num money-in">${fmt(m.income)}</td><td class="num money-out">${fmt(m.expense)}</td><td class="num">${fmt(m.net)}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">ยังไม่มีข้อมูล</td></tr>'}</tbody>
        </table></div>
      </div>

      <h3>รายการรายรับ-รายจ่าย ${thMonth(month)}</h3>
      <p class="muted" style="font-size:13px;margin:-4px 0 8px">ค่าเช่าเข้ามาเองเมื่อยืนยันการโอน · ค่าซ่อมเข้ามาเองจากงานซ่อม · รายการอื่นกดปุ่มรายรับ/รายจ่ายด้านบน</p>
      <div class="card">${d.entries.length ? d.entries.map((e) => `
        <div class="list-item row spread">
          <div class="grow"><strong class="${e.type === 'income' ? 'money-in' : 'money-out'}">${e.type === 'income' ? '+' : '−'}${fmt(e.amount)}</strong> ${esc(e.category)}
            <span class="pill ${e.source === 'manual' ? 's-ended' : 's-occupied'}" style="margin-left:4px">${e.source === 'invoice' ? 'จากใบแจ้งหนี้' : e.source === 'repair' ? 'จากงานซ่อม' : 'บันทึกเอง'}</span>
            <div class="muted" style="font-size:14px">${thDate(e.date)}${e.note ? ' · ' + esc(e.note) : ''}</div>

      ${state.master ? '' : `<p><button type="button" class="ghost small" id="myPw">เปลี่ยนรหัสผ่านของฉัน</button></p>`}

    $('#addAdmin').onclick = () => adminForm({ active: true });

  function slipForm(inv) {

      busy($('button[type=submit]', e.target), async () => {
        const [file] = await readFiles($('[name=file]', e.target));
        if (!file) throw new Error('กรุณาเลือกรูปสลิป');
        await api('apiUploadSlip', inv.id, file, $('[name=amount]', e.target).value);
        closeModal();
        toast('ส่งสลิปแล้ว รอผู้ดูแลตรวจสอบ');
        tenantBills();
      });
    };
  }

  function tenantRepair() {
    return swr('tenant', loadTenant, drawTenantRepair);
  }
  function drawTenantRepair(d) {
    state.tenant = d;
    $('#view').innerHTML = `
      ${sec('แจ้งซ่อม')}
      <div class="cols">
        <form id="trForm" class="card" style="margin:0">
          <label style="margin-top:0">เรื่อง *</label><input name="title" required placeholder="เช่น ไฟห้องน้ำไม่ติด">
          <label>รายละเอียด</label><textarea name="detail"></textarea>
          <label>แนบรูป (ไม่เกิน 3 รูป)</label><input name="photos" type="file" accept="image/\x2a" multiple>
          <p style="margin-top:16px"><button type="submit" style="width:100%">ส่งเรื่องแจ้งซ่อม</button></p>
        </form>
        <div>
          <h3 style="margin-top:0">ประวัติแจ้งซ่อม</h3>
          <div class="card">${d.repairs.length ? d.repairs.map(repairRow).join('') : '<span class="muted">ยังไม่มี</span>'}</div>
        </div>
      </div>`;
    $('#trForm').onsubmit = (e) => {
      e.preventDefault();
      const f = formData(e.target);
      delete f.photos;
      busy($('button[type=submit]', e.target), async () => {
        const photos = await readFiles($('[name=photos]', e.target));
        await api('apiReportRepair', f, photos);
        toast('ส่งเรื่องแล้ว');
        tenantRepair();
      });
    };
  }

  function tenantMe() {
    return swr('tenant', loadTenant, drawTenantMe);
  }
  function drawTenantMe(d) {
    state.tenant = d;
    $('#view').innerHTML = `
      ${sec('ห้องของฉัน')}
      <div class="cols">
        <div class="card" style="margin:0">
          <div class="tenant-head"><span class="avatar">${initial(d.tenancy.tenantName)}</span>
            <div><strong style="font-size:18px">${esc(d.tenancy.tenantName)}</strong><div class="muted">ห้อง ${esc(d.roomId)}</div></div></div>
          <div class="list-item li" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)"><span class="ic">${ic('door')}</span><div><div class="muted" style="font-size:13px">ย้ายเข้าเมื่อ</div><strong>${thDate(d.tenancy.moveIn)}</strong></div></div>
          <div class="list-item li"><span class="ic">${ic('bill')}</span><div><div class="muted" style="font-size:13px">ค่าเช่า</div><strong>${fmt(d.tenancy.rent)} บาท/เดือน</strong></div></div>
          ${d.tenancy.contractFileId ? `<p style="margin-top:14px"><button type="button" class="ghost" data-file="${esc(d.tenancy.contractFileId)}" data-title="สัญญาเช่า">${ic('file')} ดูสัญญาเช่า</button></p>` : ''}
          ${(d.tenancy.signedContracts || []).length ? `<div class="signed"><strong>สัญญาที่เซ็นแล้ว</strong>${signedList(d.tenancy.signedContracts, false)}</div>` : ''}
        </div>
        <div class="card li" style="margin:0"><span class="ic">${ic('phone')}</span><div class="grow"><div class="muted" style="font-size:13px">ติดต่อผู้ดูแลหอ</div><strong>${esc(d.settings.phone)}</strong></div>
          ${d.settings.phone && d.settings.phone !== '-' ? `<a class="btn small" href="tel:${esc(d.settings.phone.replace(/[^0-9+]/g, ''))}">โทร</a>` : ''}</div>
      </div>`;
  }

  // ================= เริ่มทำงาน =================
  (async function boot() {
    state.token = Store.get() || await Store.fromShell();
    if (!state.token) return showLogin();
    // จำบทบาทไว้ในเครื่องแล้ว: เปิดหน้าได้เลย ไม่ต้องถามเซิร์ฟเวอร์ก่อน
    // (ถ้า session หมดอายุ คำขอแรกจะตอบ AUTH แล้วเด้งไปหน้าเข้าสู่ระบบเอง)
    const me = Store.getMe();
    if (me && me.role) {
      state.roomId = me.roomId || '';
      state.name = me.name || '';
      state.master = !!me.master;
      return start(me.role);
    }
    try {
      const who = await run('apiWhoAmI', state.token);
      state.roomId = who.roomId || '';
      state.name = who.name || '';
      state.master = !!who.master;
      Store.set(state.token);
      Store.setMe({ role: who.role, roomId: state.roomId, name: state.name, master: state.master });
      start(who.role);
    } catch (e) {
      showLogin();
    }
  })();
})();
</script>
